# Fast path: check and publish the relay-control image on Blacksmith runners,
# outside the shared GitHub-hosted queue. Anyone with write access (people or
# agents) may start it; nothing runs until Khaliq approves the fast-path
# environment.
#
# It runs the same checks as CI (typecheck and tests) plus the agent unit
# tests, then pushes a linux/amd64+linux/arm64 build to
# ghcr.io/agentworkforce/relay-control tagged fast-<sha> only. It never moves
# or claims a release tag: no :latest, :main, semver or sha-<sha> (the release
# workflow refuses to overwrite sha-<sha>, so the fast path leaves it free).
# It refuses to overwrite an existing fast-<sha> (the release workflow accepts
# fast-* as a release tag) and does not notify infra of a release candidate.
# Pin the digest printed in the run summary.
#
# No signed GitHub attestation is pushed: attest-build-provenance records the
# dispatch commit, not the `ref` actually built. BuildKit's SBOM and max-mode
# provenance (which read the checkout) are attached to the image.
name: fast-path
run-name: fast-path ${{ inputs.ref }} (${{ inputs.reason }})
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to build (a PR branch is fine)
        required: true
        default: main
      reason:
        description: Why this needs the fast path
        required: true
permissions:
  contents: read
concurrency:
  group: fast-path-${{ inputs.ref }}
  cancel-in-progress: false
env:
  IMAGE: ghcr.io/agentworkforce/relay-control
jobs:
  verify:
    environment: fast-path
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - name: Agent unit tests
        run: python3 -m unittest discover -s agent/test -v

  image:
    needs: verify
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse an existing fast tag
        env:
          SHA: ${{ needs.verify.outputs.sha }}
        run: |
          set -euo pipefail
          # The release workflow accepts any unreserved tag, fast-* included, so
          # never overwrite an existing tag: pin the digest it already names.
          out="$RUNNER_TEMP/imagetools-fast.txt"
          if docker buildx imagetools inspect "$IMAGE:fast-$SHA" >"$out" 2>&1; then
            echo "::error::$IMAGE:fast-$SHA already exists; pin its digest instead of republishing."
            exit 1
          fi
          if ! grep -Eqi 'manifest unknown|name unknown|not found' "$out"; then
            cat "$out" >&2
            echo "::error::Could not prove $IMAGE:fast-$SHA is absent; failing closed."
            exit 1
          fi
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            IMAGE_REVISION=${{ needs.verify.outputs.sha }}
            IMAGE_VERSION=fast-${{ needs.verify.outputs.sha }}
          tags: ${{ env.IMAGE }}:fast-${{ needs.verify.outputs.sha }}
          labels: |
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.verify.outputs.sha }}
            org.opencontainers.image.version=fast-${{ needs.verify.outputs.sha }}
          provenance: mode=max
          sbom: true
      - name: Summary
        env:
          REF: ${{ inputs.ref }}
          SHA: ${{ needs.verify.outputs.sha }}
          REASON: ${{ inputs.reason }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### relay-control fast path"
            echo "- ref: \`$REF\` at \`$SHA\`"
            echo "- reason: $REASON"
            echo "- image: \`${IMAGE}@${DIGEST}\` (tag fast-$SHA)"
          } >> "$GITHUB_STEP_SUMMARY"
