name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck and test
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) && 'ubuntu-latest' || vars.CI_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  cloud-import-harness:
    # The cloud-import verifier's real-Postgres harness (scripts/cloud-import-verify/dry-run.ts).
    # `npm test` skips those suites without it, so importer, copier and verifier drift would go
    # unnoticed. Runs on every push to main, and on pull requests that touch src/, scripts/,
    # migrations/, the cloud-import tests, the package files or this workflow.
    # The harness runs on PostgreSQL 15 because the committed schema manifest is a PostgreSQL 15
    # catalog fingerprint and newer majors catalog objects differently.
    name: Cloud import verifier harness (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether the harness applies
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed=$(git diff --name-only "origin/$BASE_REF...HEAD")
          if echo "$changed" | grep -Eq '^(src/|scripts/|migrations/|test/cloud-import|package(-lock)?\.json$|\.github/workflows/ci\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipped: no change under src/, scripts/, migrations/, test/cloud-import*, package files or this workflow."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.scope.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.scope.outputs.run == 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install PostgreSQL 15 (the schema manifest's catalog version)
        if: steps.scope.outputs.run == 'true'
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends postgresql-15

      - name: Run the verifier harness on a disposable PostgreSQL cluster
        if: steps.scope.outputs.run == 'true'
        run: |
          export CLOUD_VERIFY_PG_BIN=/usr/lib/postgresql/15/bin
          "$CLOUD_VERIFY_PG_BIN/postgres" --version
          node --import tsx scripts/cloud-import-verify/dry-run.ts
