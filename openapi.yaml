      - $ref: "#/components/parameters/Provider"
    post:
      operationId: internalIntegrationToken
      security:
        - serviceAuth: []
      description: |
        Returns a usable access token, refreshing it under a row lock when it
        expires within 2 minutes or when forceRefresh is true. Refresh tokens
        never leave the control plane. Call again on a provider 401 with
        forceRefresh. Every read is audited.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                forceRefresh: { type: boolean }
      responses:
        "200":
          description: Token
