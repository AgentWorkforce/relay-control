openapi: 3.1.0
info:
  title: Agent Relay Self-hosted Sessions Control Plane
  version: 0.1.0
  description: |
    Minimal sessions, messaging, Relayflows, and hosted MCP control plane. It
    deliberately excludes billing, fleet, and Relayfile. Provider integrations
    use bring-your-own OAuth apps instead of hosted Nango.
    Relayflows covers flow definitions, runs, and the cloud worker assignment
    protocol spoken by `agent-relay cloud worker`.
    Every `/api/v1/*` operation is also mounted at `/cloud/api/v1/*` with
    identical methods, bodies, and responses. Bearer authentication remains
    available on both mounts; the `/cloud` mount additionally accepts the
    same-origin HttpOnly session cookie issued by `/login`.
    Client-visible Relaycast and RelayHistory URLs are explicit public HTTPS
    origins and are distinct from internal server-to-server upstream URLs.
    Desktop feed (`/api/v1/desktop/feed/*`, tag "Desktop feed (draft contract)")
    is a draft contract only (x-status proposed; Cloud team decides, not yet
    confirmed); this server implements none of it. Signing: the
    hosted feed signs each release at publish with Ed25519 (RFC 8032) over the
    RFC 8785 (JCS) canonical UTF-8 bytes of the envelope's `manifest` object;
    `key_id` selects the key, and a client holds one key and refuses any
    other. Self-hosted and customer deployments import or mirror pre-signed
    envelopes and verify them against the profile's public key; they hold no
    private key. The signer provider is unresolved (x-status unresolved).
servers:
  - url: "{controlPlaneUrl}"
    variables:
      controlPlaneUrl:
        default: http://127.0.0.1:3000
security:
  - bearerAuth: []
tags:
  - name: amp
    description: |
      Amp thread control (SELFHOST_AMP_ENABLED, default off). See docs/amp.md.
  - name: factory
    description: |
      Factory sessions (docs/factory-sessions.md). Every operation answers
      404 not_found when SELFHOST_FACTORY_ENABLED is off. Errors are
      {error, message} with stable codes; secrets are never returned.
  - name: internal
    description: |
      In-cluster service routes under /internal/v1. Never served through the
      /cloud alias; each operation names the service credential it accepts.
  - name: Desktop feed (draft contract)
    x-status: proposed
    description: |
      Private, workspace-authenticated release feed for enterprise Desktop
      profiles (relay-desktop docs/enterprise-distribution.md at 21e61026;
      contract notes in docs/desktop-feed.md). Status: proposed, Cloud team
      decides, not yet confirmed. Nothing here is implemented.

      Credentials: workspace bearer (`bearerAuth`, the desktop-core session),
      `installToken`, browser session (`cookieAuth`, `/cloud` mount only) and
      `publisherToken`. Each operation lists the kinds it accepts in its
      description and in `x-desktop-feed-credentials`. A publisher token on a
      read endpoint, and any other credential on a publisher endpoint, is 403
      `wrong_credential`. A request carrying more than one credential (for
      example a bearer and the session cookie) is 400 `mixed_credentials`: it
      is refused, never merged, unlike the rest of the API where the bearer
      wins over the cookie.

      Signing: the hosted feed signs at publish, after verifying the declared
      asset set; Ed25519 (RFC 8032) over the RFC 8785 (JCS) canonical UTF-8
      bytes of the `manifest` object; signature base64url without padding,
      64 bytes; `key_id` selects the key; a client holds one key and refuses
      others. Self-hosted and customer deployments (paths (a), (b), (c)) only
      import or mirror and verify pre-signed envelopes, store them verbatim
      and hold no private key.

      Rate limits on every endpoint answer 429 with Retry-After; per-profile
      quota and retention appear in the publisher's version listing
      (`DesktopFeedLimits`).
    x-proposed-default: "gcpkms hosted, awskms non-production; see docs/desktop-feed.md Proposed defaults"
    x-signer-provider:
      x-status: unresolved
      description: |
        The provider that holds the hosted feed's per-profile Ed25519 private
        keys is unresolved. A private key stored in Postgres is not a fallback.
paths:
  /api/v1/mcp/shared-sessions:
    post:
      operationId: hostedMcpSharedSessions
      summary: Stateless MCP Streamable HTTP endpoint (JSON responses, one request per POST).
      description: |
        Serves the `agent-relay-selfhost` MCP server ("Agent Relay Sessions",
        version 0.1.0). Tool groups served: shared session reads
        (`open_shared_sessions`, `search_shared_sessions`, `get_shared_session`,
        `get_shared_session_context`, `list_session_timings`), team activity
        (`list_team_activity`, from the Relaycast roster and presence plus
        RelayHistory; running flows are not listed), relay messaging
        (`list_relay_agents`, `send_relay_message`, `read_relay_conversation`,
        `join_relay`, `leave_relay`, `relay_status`, `check_relay_inbox`,
        `list_relay_channels`, `subscribe_relay_channel`,
        `unsubscribe_relay_channel`, `post_relay_channel`, `read_relay_channel`;
        names and arguments match Cloud), and capability discovery
        (`describe_capabilities`; its report lists `groups` and, next to them,
        `providers`: the same `ProviderStatus` array as
        `GET /api/v1/workspaces/{workspaceId}/providers`). Relay tools act as a hosted Relaycast
        participant owned by the caller, bound to the `Mcp-Session-Id` or chosen
        with `as`; replies arrive in `check_relay_inbox`. Launches,
        `as_person` and desktop-linked identity (`join_relay desktop_address`)
        are not yet available. Initialize advertises the experimental capability
        `com.agentrelay/native-session-identity` version 1 and returns an
        `Mcp-Session-Id` header.

        Requires a personal credential with `cli:auth`: a device bearer token,
        or on the `/cloud` mount the session cookie behind the origin guard.
        Workspace API tokens (`sh_wk_`) and the internal service token are
        refused. Every tool is pinned to the credential's workspace. The
        cross-origin, legacy `X-Agent-Relay-Session-Kind`/`-Id` header,
        `Mcp-Session-Id`, body size, and native chat context checks run before
        the MCP server. `X-Agent-Relay-Desktop: 1` marks a desktop call; for
        `tools/call` its `_meta.threadId`, when present, must be a UUID.
        Every refusal is a JSON-RPC error envelope with `Cache-Control: no-store`.
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: A JSON-RPC 2.0 message or batch, at most 64 KiB.
      responses:
        "200":
          description: JSON-RPC response
        "202":
          description: Notification or response accepted
        "400":
          description: Parse error (-32700), invalid Mcp-Session-Id (-32600), or invalid desktop identity headers or native chat context (-32602)
        "401":
          description: Missing or invalid credential (-32001), with WWW-Authenticate Bearer
        "403":
          description: Cross-origin request, or a credential that is not a personal cli:auth session (-32003)
        "405":
          description: "Any method other than POST (-32000), with `Allow: POST`"
        "413":
          description: Body larger than 64 KiB (-32600)
        "500":
          description: Internal server error (-32603)
  /api/v1/workspaces/{workspaceId}/messaging/people:
    get:
      operationId: listMessagingPeople
      summary: Current organization members whose identity is bound to this workspace's Relaycast workspace. No credential is returned.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Member directory without tokens
        "403":
          description: Agent, CI, or service credential
  /api/v1/workspaces/{workspaceId}/messaging/identity/credential:
    post:
      operationId: issuePersonCredential
      summary: Mint or recover the caller's human-agent token. Session or cli:auth only.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Identity envelope with the human agent name, id, token, and public Relaycast origin
          content:
            application/json:
              schema:
                type: object
                required: [identity]
                properties:
                  identity:
                    type: object
                    required: [name, agentId, token, relaycastUrl]
                    properties:
                      name: { type: string }
                      agentId: { type: string }
                      token: { type: string }
                      relaycastUrl: { type: string, format: uri }
        "403":
          description: Agent, CI, or service credential, or cookie request failed the origin check
        "409":
          description: register_human admission is full, or the name is held by someone else
  /api/v1/workspaces/{workspaceId}/messaging/conversations/{agentName}:
    get:
      operationId: readPersonConversation
      summary: Read the Relaycast conversation. Does not create an identity.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: agentName
          in: path
          required: true
          schema: { type: string }
        - name: before
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Both authors, oldest first. you is null and messages is empty when this member has no identity for the current relay binding.
          content:
            application/json:
              schema:
                type: object
                required: [you, peer, messages, earlier]
                properties:
                  you: { type: [string, "null"] }
                  peer: { type: string }
                  earlier: { type: [string, "null"] }
                  messages:
                    type: array
                    items:
                      type: object
                      required: [id, text, mine]
                      properties:
                        id: { type: string }
                        text: { type: string }
                        mine: { type: boolean }
                        sender: { type: string }
                        createdAt: { type: [string, "null"] }
        "400":
          description: Malformed path or cursor
    post:
      operationId: sendPersonMessage
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: agentName
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text, clientMessageId]
              properties:
                text: { type: string, minLength: 1, maxLength: 16000 }
                clientMessageId: { type: string, pattern: "^[A-Za-z0-9_-]{8,64}$" }
      responses:
        "201":
          description: Message accepted by Relaycast
        "200":
          description: Same clientMessageId, recipient, and text already accepted
        "404":
          description: recipient_not_found
        "409":
          description: clientMessageId reused for a different recipient or text
        "502":
          description: upstream_unavailable, or send_uncertain when delivery may already have happened. The same clientMessageId is not dispatched again.
  /healthz:
    get:
      security: []
      operationId: health
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
  /readyz:
    get:
      security: []
      operationId: readiness
      responses:
        "200":
          description: Database and schema are ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          description: Database or schema is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
  /cloud/api/health:
    get:
      security: []
      operationId: dashboardHealth
      responses:
        "200":
          description: Cloud-compatible dashboard health
          content:
            application/json:
              schema:
                type: object
                required: [status, timestamp, version]
                properties:
                  status:
                    const: ok
                  timestamp:
                    type: string
                    format: date-time
                  version:
                    type: string
  /login:
    get:
      security: []
      operationId: browserLogin
      description: |
        Starts an RFC 8628 authorization and renders the user code. A short-lived
        Secure HttpOnly device cookie lets the page poll without exposing the
        device code or resulting access/refresh tokens to JavaScript.
      parameters:
        - name: next
          in: query
          required: false
          description: |
            Same-origin absolute path to open after sign-in (for example the
            dashboard's `/#/device?user_code=...`). Anything else becomes `/`.
          schema:
            type: string
            maxLength: 2048
      responses:
        "200":
          description: Minimal browser device-login page
          headers:
            Set-Cookie:
              schema:
                type: string
  /login/poll:
    post:
      security:
        - deviceCookie: []
      operationId: pollBrowserLogin
      responses:
        "200":
          description: |
            Authorization completed. Sets the Secure HttpOnly session cookie;
            the JSON response contains no access or refresh token.
          headers:
            Set-Cookie:
              schema:
                type: string
        "202":
          description: Authorization remains pending
        "401":
          description: Login cookie is missing, expired, denied, or consumed
  /cloud/api/auth/session:
    get:
      security:
        - cookieAuth: []
      operationId: dashboardSession
      parameters:
        - name: renew
          in: query
          schema:
            const: "0"
      responses:
        "200":
          description: Cloud-compatible account context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardAccount"
        "401":
          description: >-
            Missing, expired, rotated, or revoked session cookie; or
            {authenticated: false, reason: reauthentication_required} for a
            session issued before the account scope existed
  /cloud/api/auth/workspace:
    post:
      security:
        - cookieAuth: []
      operationId: switchAccountWorkspace
      description: >-
        Requires the account scope (browser sessions) and a same-origin
        request. Issues a new session bound to the chosen workspace (any
        workspace the person is a member of, in any organization), sets a new
        cookie, revokes the previous access and refresh tokens, and remembers
        the choice for the next sign-in. Rate limited per user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workspaceId]
              properties:
                workspaceId: { type: string, format: uuid }
      responses:
        "200":
          description: Account context for the new session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardAccount"
        "400":
          description: Missing workspaceId
        "401":
          description: Not signed in
        "403":
          description: Cross-origin request, or reauthentication_required (no account scope)
        "404":
          description: Not a workspace the person belongs to
        "429":
          description: Rate limited
  /api/v1/auth/device/start:
    post:
      security: []
      operationId: startDeviceAuthorization
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                client_name:
                  type: string
                  maxLength: 120
                desktop_host_name:
                  type: string
                  maxLength: 80
                  description: |
                    Agent Relay Desktop's machine name, shown on the approval
                    page. Display data only. Desktop's PKCE fields
                    (`desktop_code_challenge*`) are accepted and ignored.
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                client_name:
                  type: string
      responses:
        "201":
          description: RFC 8628 device authorization created
          headers:
            Cache-Control:
              schema:
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceStart"
        "429":
          description: Per-client-address limit (10 per 5 minutes); see Retry-After
  /api/v1/auth/device/approve:
    get:
      security: []
      operationId: openDeviceApproval
      description: |
        `verification_uri` and `verification_uri_complete`. Redirects a person
        to the dashboard approval route `SELFHOST_DASHBOARD_URL#/device`, adding
        `?user_code=` when a valid code was given. The dashboard sends a
        signed-out person through `/login?next=` and back.
      parameters:
        - name: user_code
          in: query
          required: false
          schema:
            type: string
      responses:
        "303":
          description: Redirect to the dashboard approval page
          headers:
            Location:
              schema:
                type: string
                format: uri
    post:
      operationId: decideDeviceAuthorization
      security:
        - bearerAuth: []
        - cookieAuth: []
      description: |
        `lookup` returns what the approval page shows (code, client, Desktop
        host, status, target workspace) and never the device code. A user
        (bearer, or the dashboard session cookie under `/cloud`) approves for
        that user and their session's workspace; `workspace_id` defaults to it
        and any other is `404`. The bootstrap bearer may approve for `user_id`
        and `workspace_id`; this is the initial provisioning path.

        Cookie requests must be `application/json` with an `Origin` of the API
        or dashboard origin (or `Sec-Fetch-Site: same-origin`), else `403
        csrf_rejected`. Users are limited to 30 calls per 5 minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, user_code]
              properties:
                action:
                  enum: [lookup, approve, deny]
                user_code:
                  type: string
                workspace_id:
                  type: string
                  format: uuid
                  description: Required with the bootstrap bearer for approve/deny.
                user_id:
                  type: string
                  format: uuid
                  description: Required with the bootstrap bearer; ignored for user bearers.
      responses:
        "200":
          description: Decision recorded, or the lookup result
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [status]
                    properties:
                      status:
                        enum: [approved, denied]
                  - $ref: "#/components/schemas/DeviceLookup"
        "403":
          description: Approver is not a member of the workspace, or a cookie request failed the CSRF check
        "404":
          description: Device authorization was not found
        "409":
          description: Device authorization was already decided
        "410":
          description: Device authorization expired
        "429":
          description: Approval limit reached; see Retry-After
  /api/v1/auth/device/token:
    post:
      security: []
      operationId: pollDeviceAuthorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceTokenRequest"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/DeviceTokenRequest"
      responses:
        "200":
          description: Renewable token pair issued; the device code is consumed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthTokenPair"
        "400":
          description: RFC 8628 progress or terminal error
          content:
            application/json:
              schema:
                type: object
                required: [error, interval]
                properties:
                  error:
                    enum:
                      - authorization_pending
                      - slow_down
                      - access_denied
                      - expired_token
                      - invalid_grant
                  error_description:
                    type: string
                  interval:
                    type: integer
        "429":
          description: Per-client-address limit (120 per minute); see Retry-After
  /api/v1/auth/token/refresh:
    post:
      security: []
      operationId: refreshToken
      description: Atomically rotates both tokens. The old access and refresh tokens stop working.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        "200":
          description: Rotated pair
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "403":
          description: Invalid, expired, revoked, or previously rotated refresh token
  /api/v1/auth/token/revoke:
    post:
      security: []
      operationId: revokeToken
      description: Revokes the session identified by a body token or the bearer.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
      responses:
        "200":
          description: Session revoked
        "404":
          description: Token not found
  /api/v1/cli/login:
    get:
      security: [{ cookieAuth: [] }]
      operationId: desktopBrowserLogin
      description: >-
        Agent Relay Desktop's browser sign-in (hosted Cloud's /api/v1/cli/login).
        Only reachable with the /login session cookie, so use the /cloud/api/v1
        alias; a signed-out browser is redirected to /login and returned here.
        Hosted's provider starts, /cloud/api/auth/google/start and
        /cloud/api/auth/microsoft/start with next=/api/v1/cli/login?..., also
        land on /login here with the inner parameters kept. Unknown query
        parameters (workspace_selection) are ignored.
        With client=desktop and an S256 code_challenge, issues a 15-minute
        handoff access token bound to the challenge and redirects (307) to the
        loopback redirect_uri with state, access_token,
        access_token_expires_at and api_url (<site>/cloud: the dashboard or
        public origin the request arrived on). No
        refresh token is placed in the URL. With desktop_host_name, a consent
        page asks the person to approve "Agent Relay Desktop on <host>" first;
        its Approve posts the same parameters back (303 on approval).
        Rate limit 30 per minute per client address.
      parameters:
        - { name: redirect_uri, in: query, required: true, schema: { type: string, format: uri }, description: http(s) URL on 127.0.0.1 or localhost }
        - { name: state, in: query, schema: { type: string } }
        - { name: client, in: query, required: true, schema: { type: string, enum: [desktop] } }
        - { name: workspace_selection, in: query, schema: { type: string } }
        - { name: code_challenge, in: query, required: true, schema: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" } }
        - { name: code_challenge_method, in: query, required: true, schema: { type: string, enum: [S256] } }
        - { name: desktop_host_name, in: query, schema: { type: string, maxLength: 80 } }
        - { name: workspace, in: query, schema: { type: string }, description: Must be the session's workspace }
      responses:
        "200":
          description: Consent page (desktop_host_name given)
          content: { text/html: { schema: { type: string } } }
        "302":
          description: Signed out; Location is /login?next=
        "307":
          description: Handoff issued; Location is redirect_uri with the handoff parameters
        "400":
          description: Invalid redirect_uri, challenge, or host name
        "403":
          description: Requested workspace is not the session's
    post:
      security: [{ cookieAuth: [] }]
      operationId: desktopBrowserLoginConsent
      description: >-
        The consent screen's decision: a same-origin form post carrying the
        single-use consent_token the page embedded for this person and this
        sign-in attempt, decision approve or deny.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [redirect_uri, client, code_challenge, code_challenge_method, desktop_host_name, consent_token, decision]
              properties:
                redirect_uri: { type: string }
                state: { type: string }
                client: { type: string }
                workspace_selection: { type: string }
                code_challenge: { type: string }
                code_challenge_method: { type: string }
                desktop_host_name: { type: string }
                workspace: { type: string }
                consent_token: { type: string }
                decision: { type: string, enum: [approve, deny] }
      responses:
        "200":
          description: Denied page
          content: { text/html: { schema: { type: string } } }
        "303":
          description: Approved; Location is redirect_uri with the handoff parameters
        "403":
          description: Cross-origin post, or a consent token that is missing, used, or for another attempt
  /api/v1/auth/desktop/session:
    post:
      security: [{ bearerAuth: [] }]
      operationId: exchangeDesktopHandoff
      description: >-
        Redeems a browser sign-in handoff once: the bearer is the handoff
        access token and codeVerifier proves its S256 code_challenge. Returns
        a renewable session in the same token family (hosted Cloud's shape).
        Rate limit 30 per minute per client address.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [codeVerifier]
              properties:
                codeVerifier: { type: string, pattern: "^[A-Za-z0-9._~-]{43,128}$" }
      responses:
        "200":
          description: Renewable session
          content:
            application/json:
              schema:
                type: object
                required: [accessToken, accessTokenExpiresAt, refreshToken, refreshTokenExpiresAt, apiUrl, tokenType]
                properties:
                  accessToken: { type: string }
                  accessTokenExpiresAt: { type: string, format: date-time }
                  refreshToken: { type: string }
                  refreshTokenExpiresAt: { type: string, format: date-time }
                  apiUrl: { type: string, description: "<site>/cloud (the dashboard or public origin the request arrived on)" }
                  tokenType: { type: string, enum: [Bearer] }
        "400":
          description: Missing codeVerifier
        "401":
          description: Not a live, unredeemed handoff, or the verifier does not match
  /api/v1/auth/desktop/workspaces:
    get:
      security: [{ bearerAuth: [] }]
      operationId: listDesktopWorkspaces
      description: >-
        Requires a Desktop session (scope desktop:workspaces). Lists every
        workspace the person belongs to, across organizations, with the
        session's current workspace. Rate limited per user.
      responses:
        "200":
          description: Member workspaces
          content:
            application/json:
              schema:
                type: object
                required: [current_workspace_id, workspaces]
                properties:
                  current_workspace_id: { type: string, format: uuid }
                  workspaces:
                    type: array
                    items:
                      type: object
                      required: [id, name, organization_id, organization_name, role]
                      properties:
                        id: { type: string, format: uuid }
                        name: { type: string }
                        organization_id: { type: string, format: uuid }
                        organization_name: { type: string }
                        role: { enum: [owner, admin, member] }
        "401":
          description: Invalid or expired bearer
        "403":
          description: reauthentication_required, the bearer lacks desktop:workspaces; or handoff_not_exchanged, a handoff token before its verifier exchange
    post:
      security: [{ bearerAuth: [] }]
      operationId: switchDesktopWorkspace
      description: >-
        Requires scope desktop:workspaces. Issues a new Desktop session bound
        to the chosen member workspace, in the same token family, with the
        same scopes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workspaceId]
              properties:
                workspaceId: { type: string, format: uuid }
      responses:
        "200":
          description: Renewable session bound to the chosen workspace
          content:
            application/json:
              schema:
                type: object
                required: [accessToken, accessTokenExpiresAt, refreshToken, refreshTokenExpiresAt, apiUrl, tokenType, workspace]
                properties:
                  accessToken: { type: string }
                  accessTokenExpiresAt: { type: string, format: date-time }
                  refreshToken: { type: string }
                  refreshTokenExpiresAt: { type: string, format: date-time }
                  apiUrl: { type: string }
                  tokenType: { type: string, enum: [Bearer] }
                  workspace:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      name: { type: string }
                      organization_id: { type: string, format: uuid }
                      organization_name: { type: string }
        "400":
          description: Missing workspaceId
        "401":
          description: Invalid or expired bearer
        "403":
          description: reauthentication_required, the bearer lacks desktop:workspaces; or handoff_not_exchanged, a handoff token before its verifier exchange
        "404":
          description: Not a workspace the person belongs to
        "429":
          description: Rate limited
  /api/v1/installation/settings:
    get:
      security: [{ bearerAuth: [] }]
      operationId: getInstallationSettings
      description: Bootstrap bearer only. Stored kill-switch overrides and their effective values.
      responses:
        "200":
          description: Installation settings
        "403":
          description: Bootstrap bearer required
    patch:
      security: [{ bearerAuth: [] }]
      operationId: patchInstallationSettings
      description: >-
        Bootstrap bearer only. A boolean overrides the env flag, null follows
        it again, an omitted field is unchanged. Applies to the next request
        without a restart; audited as installation.settings. Both effective
        values are false in single mode.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                personalOrgSignupEnabled: { type: [boolean, "null"] }
                selfServeOrganizationsEnabled: { type: [boolean, "null"] }
      responses:
        "200":
          description: Updated settings
        "400":
          description: Invalid body
        "403":
          description: Bootstrap bearer required
  /api/v1/auth/whoami:
    get:
      operationId: whoami
      responses:
        "200":
          description: Current user and token-bound tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Whoami"
        "401":
          description: Invalid, expired, rotated, or revoked bearer
  /api/v1/organizations:
    get:
      operationId: listOrganizations
      description: User bearers see their organizations; the bootstrap bearer sees all.
      responses:
        "200":
          description: Organizations
    post:
      operationId: createOrganization
      description: >-
        The bootstrap bearer creates the organization and its owner
        atomically ({name, ownerEmail, ownerName}). With SELFHOST_TENANCY=multi
        and self-serve organizations on, a person with the browser account
        session (the /cloud cookie, scope account, from the same origin) may
        send {name} and becomes the owner of a new organization with a Default workspace; rate limited per
        user and per address. In single mode only the bootstrap bearer may
        create, and only while no organization exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                ownerEmail:
                  type: string
                  format: email
                  description: Bootstrap bearer form only
                ownerName:
                  type: string
                  description: Bootstrap bearer form only
      responses:
        "201":
          description: Organization and owner created
        "403":
          description: >-
            Bootstrap bearer required (single mode), cross-origin cookie
            request, self_serve_disabled, or reauthentication_required (not
            the browser account session)
        "409":
          description: Single mode and an organization already exists
        "429":
          description: Self-serve rate limit
        "503":
          description: not_ready, the Relaycast workspace could not be created (multi-mode self-serve)
  /api/v1/organizations/{organizationId}/workspaces:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      operationId: listWorkspaces
      responses:
        "200":
          description: Workspaces visible through organization membership
        "404":
          description: Organization is not visible to this tenant
    post:
      operationId: createWorkspace
      description: Organization owner/admin or bootstrap bearer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, relaycastApiKey]
              properties:
                name:
                  type: string
                relaycastWorkspaceId:
                  type: string
                  description: Defaults to the new local workspace UUID.
                relaycastApiKey:
                  type: string
                  description: Encrypted with SELFHOST_ENCRYPTION_KEY before storage.
      responses:
        "201":
          description: Workspace created
  /api/v1/organizations/{organizationId}/workspaces/{workspaceId}:
    put:
      security: [{ bearerAuth: [] }]
      operationId: updateWorkspace
      description: >-
        Replaces a workspace's Relaycast key, Relaycast workspace id, or name
        (any subset), for example after the Relaycast it points at was reset
        and a new key minted there. Bootstrap bearer or organization
        owner/admin. The previous key ciphertext is overwritten.
      parameters:
        - { name: organizationId, in: path, required: true, schema: { type: string } }
        - { name: workspaceId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name: { type: string }
                relaycastWorkspaceId: { type: string }
                relaycastApiKey: { type: string }
      responses:
        "200":
          description: Updated workspace (no key material)
        "400":
          description: Nothing to update
        "404":
          description: Workspace not found
  /api/v1/fleet/nodes/claim:
    post:
      security: [{ bearerAuth: [] }]
      operationId: claimFleetNode
      description: >-
        Records a Relaycast node as the caller's own computer (hosted Cloud's
        fleet/nodes/claim): Agent Relay Desktop claims its spawn node so spawns
        onto it are accepted. The node token is proven against Relaycast
        (/v1/node/me, then the workspace key's read of that node) and never
        stored. Idempotent for the same person; a node owned by someone else,
        through another workspace, or through a previous relay binding is
        refused with 409. Rate limit 20 per hour per user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workspaceId, nodeToken]
              properties:
                workspaceId: { type: string, description: Must be the token's workspace }
                nodeToken: { type: string, pattern: "^nt_live_[A-Za-z0-9_-]{8,256}$" }
      responses:
        "200":
          description: Claim result
          content:
            application/json:
              schema:
                type: object
                required: [nodeId, claimed, owner]
                properties:
                  nodeId: { type: string }
                  claimed: { type: boolean, description: false when the caller already owned it }
                  owner: { type: string, enum: [you] }
        "400":
          description: Missing workspaceId or malformed node token
        "403":
          description: The token is not a valid node token for this workspace
        "404":
          description: Workspace not found
        "409":
          description: Owned by someone else or through another workspace or relay
        "502":
          description: Relaycast could not confirm the node
    delete:
      security: [{ bearerAuth: [] }]
      operationId: releaseFleetNode
      description: Removes a node's owner; the owner themselves or an organization owner.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workspaceId, nodeId]
              properties:
                workspaceId: { type: string }
                nodeId: { type: string }
      responses:
        "200":
          description: Released
        "403":
          description: Not the owner or an organization owner
        "404":
          description: No one owns that node in this workspace
  /api/v1/organizations/{organizationId}/memberships:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      operationId: listMemberships
      responses:
        "200":
          description: Organization memberships
    post:
      operationId: putMembership
      description: >-
        Organization owner/admin or bootstrap bearer. Upserts by normalized
        email. In multi mode an owner/admin may not add a person who already
        has an account and is not a member here (409 invitation_required;
        invite them instead), and an existing person's name is never
        changed; the bootstrap bearer may add them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, name, role]
              properties:
                email:
                  type: string
                  format: email
                name:
                  type: string
                role:
                  enum: [owner, admin, member]
      responses:
        "200":
          description: Membership created or updated
        "409":
          description: invitation_required (multi mode), or the last owner would be demoted
  /api/v1/organizations/{organizationId}/memberships/{userId}:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: deleteMembership
      description: Refuses to remove the last owner.
      responses:
        "204":
          description: Membership removed and its workspace token sessions cascaded
        "409":
          description: Membership is absent or is the last owner
  /api/v1/organizations/{organizationId}/domains:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      operationId: listOrganizationDomains
      description: >-
        Members or the bootstrap bearer. The organization's auto-join
        domains. In single mode they mirror SELFHOST_AUTO_JOIN_DOMAINS.
      responses:
        "200":
          description: Auto-join domains
        "404":
          description: Not a member of this organization
  /api/v1/organizations/{organizationId}/domains/{domain}:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - name: domain
        in: path
        required: true
        schema:
          type: string
    put:
      operationId: assignOrganizationDomain
      description: >-
        Bootstrap bearer only (multi mode). Verified emails at the domain
        join the organization as member at sign-in when no invite or
        membership applies. A domain belongs to at most one organization.
        Audited as organization.domain_assign.
      responses:
        "200":
          description: Already assigned to this organization
        "201":
          description: Assigned
        "400":
          description: Not a valid domain
        "403":
          description: Bootstrap bearer required
        "409":
          description: domain_assigned (another organization holds it) or domains_managed_by_env (single mode)
    delete:
      operationId: removeOrganizationDomain
      description: Bootstrap bearer only (multi mode). Audited as organization.domain_remove.
      responses:
        "204":
          description: Removed
        "403":
          description: Bootstrap bearer required
        "404":
          description: domain_not_found
        "409":
          description: domains_managed_by_env (single mode)
  /api/v1/organizations/{organizationId}/invitations:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      operationId: listInvitations
      description: Organization owner/admin or bootstrap bearer. Open (not accepted, not revoked) invites; links are never returned.
      responses:
        "200":
          description: "{ invitations: Invitation[] }"
    post:
      operationId: createInvitation
      description: |
        Organization owner/admin or bootstrap bearer (only owners invite owners).
        Replaces an open invite for the same email; refuses an existing member (409).
        The link is returned once and emailed when SMTP is configured.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                role: { enum: [owner, admin, member], default: member }
      responses:
        "201":
          description: "{ invitation, inviteUrl, emailDelivery: sent|failed|not_configured }"
        "403":
          description: Not an owner/admin, or an admin inviting an owner
        "409":
          description: Already a member
  /api/v1/organizations/{organizationId}/invitations/{invitationId}:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - { name: invitationId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      operationId: revokeInvitation
      responses:
        "200":
          description: "{ revoked: true }"
        "409":
          description: Already accepted or revoked
  /api/v1/organizations/{organizationId}/invitations/{invitationId}/link:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - { name: invitationId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: rotateInvitationLink
      description: New single-use link (the previous one stops working, expiry restarts); `send` re-emails it.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                send: { type: boolean }
      responses:
        "200":
          description: "{ invitation, inviteUrl, emailDelivery: sent|failed|not_configured|skipped }"
  /api/v1/auth/methods:
    get:
      operationId: signInMethods
      description: Any signed-in member. Which sign-in methods and invite delivery are configured.
      responses:
        "200":
          description: "{ oidc: {displayName, allowedDomains}|null, emailLink, inviteEmail, autoJoinDomains, inviteTtlHours }"
  /login/oidc/start:
    get:
      operationId: oidcStart
      description: Starts OIDC authorization code + PKCE; `next` (safe path) and `invite` are carried through.
      responses:
        "302":
          description: To the identity provider
  /login/oidc/callback:
    get:
      operationId: oidcCallback
      description: Verifies the id_token, resolves membership (member, invite, auto-join) and sets the session cookie.
      responses:
        "303":
          description: To `next` with the session cookie
        "403":
          description: Not invited, wrong domain, or invite email mismatch (HTML)
  /login/email:
    post:
      operationId: emailLinkRequest
      description: Form post (same origin). Emails a single-use 15-minute link to eligible addresses; same answer for all.
      responses:
        "200":
          description: Check-your-email page
  /login/email/verify:
    get:
      operationId: emailLinkConfirm
      responses:
        "200":
          description: Confirmation page (does not spend the link)
    post:
      operationId: emailLinkVerify
      responses:
        "303":
          description: To `next` with the session cookie
        "410":
          description: Expired or used
  /api/v1/workspaces/{workspaceId}/access/me:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: getWorkspaceAccessMe
      description: |
        Any member of the workspace, with a user access token for that workspace
        or the `/cloud` session cookie (also served at `/cloud/api/v1/...`).
        Bootstrap and workspace API tokens are refused (401). `policy` is the
        organization capture policy, or the unset default
        `{version: 1, revision: 1, settings: {}}`. See docs/capture-policy.md.
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: Caller's role and the capture policy that applies to this workspace
          content:
            application/json:
              schema:
                type: object
                required: [workspace, role, policy]
                properties:
                  workspace:
                    type: object
                    required: [id]
                    properties:
                      id: { type: string, format: uuid }
                      name: { type: string }
                  role:
                    type: string
                    enum: [owner, admin, member]
                  policy: { $ref: "#/components/schemas/CapturePolicy" }
        "401": { description: Missing, invalid, bootstrap or non-user token }
        "404": { description: Workspace not found or not the token's workspace }
  /api/v1/organizations/{organizationId}/capture-policy:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      operationId: getCapturePolicy
      description: Organization owner/admin or bootstrap bearer (members 403).
      responses:
        "200":
          description: Current policy, or the unset default
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CapturePolicy" }
        "403": { description: Owner/admin role required }
        "404": { description: Organization not found }
    put:
      operationId: putCapturePolicy
      description: |
        Organization owner/admin or bootstrap bearer. Full replace of `settings`;
        revision becomes previous + 1. Audited as `capture_policy.set` (keys only,
        never values). Cookie callers must send JSON from an allowed Origin.
      parameters:
        - name: If-Match
          in: header
          required: false
          description: Expected current revision (`7` or `"7"`); 409 when stale.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [settings]
              properties:
                settings: { $ref: "#/components/schemas/CaptureSettings" }
      responses:
        "200":
          description: Stored policy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CapturePolicy" }
        "400": { description: "`invalid_policy` (unknown key, enum or range) or malformed If-Match" }
        "403": { description: Owner/admin role required, or cross-origin cookie request }
        "404": { description: Organization not found }
        "409": { description: "`revision_mismatch`: If-Match is not the current revision" }
    delete:
      operationId: clearCapturePolicy
      description: |
        Organization owner/admin or bootstrap bearer. Resets to unset: the row is
        kept with empty settings and revision previous + 1 so revisions stay
        monotonic. Audited as `capture_policy.cleared`. Optional If-Match as for PUT.
      parameters:
        - name: If-Match
          in: header
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Cleared policy (empty settings, higher revision)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CapturePolicy" }
        "403": { description: Owner/admin role required, or cross-origin cookie request }
        "404": { description: Organization not found }
        "409": { description: "`revision_mismatch`" }
  /api/v1/organizations/{organizationId}/sessions/{sessionId}:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - name: sessionId
        in: path
        required: true
        schema: { type: string, maxLength: 512 }
    delete:
      operationId: hardDeleteSession
      description: |
        Organization owner/admin or bootstrap bearer. Permanently erases one
        session and its derived server-side artifacts through the session
        pipeline; membership is untouched. Idempotent: repeating it returns the
        same receipt. Audited as `session.hard_delete.requested` before any data
        is touched and `session.hard_deleted` once on completion. Gated by
        SELFHOST_OPERATOR_CONTROLS. Cookie callers need an allowed Origin or
        same-origin fetch metadata. See docs/session-erasure.md.
      responses:
        "200":
          description: Erase completed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionErasure" }
        "202":
          description: Erase in progress; poll the erasure read
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionErasure" }
        "400": { description: "`invalid_session_id`" }
        "403": { description: "Owner/admin role required, `operator_controls_not_entitled`, or cross-origin cookie request" }
        "404": { description: Organization or session not found }
        "501": { description: "`not_implemented`: the session pipeline erase is not configured" }
        "502": { description: "`session_erasure_failed` (carries the receipt as `erasure`) or `invalid_session_erasure_response`" }
        "503": { description: "`session_erasure_unavailable`: retry the request" }
  /api/v1/organizations/{organizationId}/sessions/{sessionId}/erasure:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - name: sessionId
        in: path
        required: true
        schema: { type: string, maxLength: 512 }
    get:
      operationId: getSessionErasure
      description: |
        Organization owner/admin or bootstrap bearer. The pipeline's erase
        receipt plus the audit record, for verifying a delete. Never gated by
        SELFHOST_OPERATOR_CONTROLS.
      responses:
        "200":
          description: Erase receipt in any status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionErasure" }
        "400": { description: "`invalid_session_id`" }
        "403": { description: Owner/admin role required }
        "404": { description: "Organization not found, or `erasure_not_found`" }
        "501": { description: "`not_implemented`: the session pipeline erase is not configured" }
        "502": { description: "`invalid_session_erasure_response`" }
        "503": { description: "`session_erasure_unavailable`: retry the request" }
  /api/v1/workspaces/{workspaceId}/resolve:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: resolveWorkspace
      description: |
        Returns the configured public Relaycast HTTPS origin. The internal
        Relaycast URL is never exposed. Requires a person credential (bearer,
        or the session cookie under `/cloud`) carrying the `cli:auth` scope;
        any workspace role may resolve. Each disclosure writes a
        `workspace.relaycast_key.resolved` audit event (no secret recorded).
        Returns 404, not 403, when the bearer belongs to another tenant or
        is no longer a member.
      responses:
        "200":
          description: Relaycast endpoint and decrypted workspace credential
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceResolution"
        "401":
          description: Missing, invalid, revoked, or bootstrap token
        "403":
          description: Token lacks `cli:auth`, or is a workspace API token (`sh_wk_`) or the internal service token
        "404":
          description: Workspace does not exist or is outside the bearer tenant
  /api/v1/workspaces/{workspaceId}/runtime:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: getRuntimeConfig
      responses:
        "200":
          description: Runtime configuration. `runtime` is null until explicitly set.
    put:
      operationId: putRuntimeConfig
      description: Organization owner/admin only. No hosted runtime is synthesized.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [runtime]
              properties:
                runtime: {}
      responses:
        "200":
          description: Stored runtime configuration
  /api/v1/workspaces/{workspaceId}/providers:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: listWorkspaceProviders
      summary: Provider catalog with this build's runtime state.
      description: |
        Read-only, for any member of the workspace; also served at
        `/cloud/api/v1/workspaces/{workspaceId}/providers`. Every known
        provider (Amp, Factory, GitHub Copilot, Capy, Replicas, Dot, Grok Bot)
        is listed with its descriptor and three separate runtime states:
        `implemented` (a provider module is present in this build),
        `configured` (its configuration resolves) and `enabled` (the module is
        mounted and switched on). A build without a provider module reports
        all three as false. `mcpGroupsRegistered` is true only when the
        provider owns MCP tool groups and every one is served by the
        shared-sessions MCP endpoint. Other methods answer 405 after
        authorization.
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: Provider statuses, in catalog order
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [providers]
                properties:
                  providers:
                    type: array
                    items:
                      $ref: "#/components/schemas/ProviderStatus"
        "401":
          description: Missing or invalid credential
        "404":
          description: Workspace does not exist or the caller is not a member (`workspace_not_found`)
        "405":
          description: Method other than GET (`method_not_allowed`)
  /cloud/api/v1/workspaces/{workspaceId}/sessions:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      security:
        - cookieAuth: []
        - bearerAuth: []
      operationId: listDashboardSessions
      description: |
        Issues a server-side read session and calls only RelayHistory
        `GET /v1/sessions`. The upstream query always includes
        `workspace={authorized workspace UUID}`; callers cannot provide or
        override an upstream origin, path, workspace, or credential.
      parameters:
        - name: metadata
          in: query
          schema:
            const: deferred
        - name: q
          in: query
          schema:
            type: string
            maxLength: 500
        - name: cursor
          in: query
          schema:
            type: string
            maxLength: 4096
        - $ref: "#/components/parameters/SessionSource"
        - name: project
          in: query
          schema:
            type: string
            maxLength: 512
        - $ref: "#/components/parameters/SessionSince"
        - $ref: "#/components/parameters/SessionUntil"
        - name: ranking
          in: query
          description: Hybrid keyword/semantic ranking; requires `q` of at least 2 characters.
          schema:
            const: hybrid
        - name: limit
          in: query
          description: Only with `ranking=hybrid`.
          schema:
            type: integer
            minimum: 1
            maximum: 25
      responses:
        "200":
          description: Dashboard session page
