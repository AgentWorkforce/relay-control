  /api/v1/workspaces/{workspaceId}/relayhistory/origin:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: getRelayhistoryOrigin
      description: |
        Read-only lookup of the RelayHistory origin this workspace's sessions
        are bound to (also under the `/cloud/api` alias). Callers are the
        user sessions the session route accepts (device session, exchanged
        Desktop handoff and its exchange session, `/cloud` browser session
        cookie), bound to this workspace, with no extra scope; an unexchanged
        Desktop sign-in handoff is refused, and service, bootstrap and
        workspace API tokens are not user tokens. A workspace in the token's
        own organization that the caller is a member of, but that the token
        is not bound to, is 403; every workspace outside the token's
        organization is 404, even one the same person belongs to. Checked in
        order: authentication, handoff, workspace binding, membership,
        configuration. Nothing is
        issued, RelayHistory is not called, and it does not count against
        anything the session issue/renew path does, so Agent Relay Desktop
        can use it for site-push admission and cold-process delete/revoke
        lookups. `origin` and `audience` are both the configured
        RELAYHISTORY_PUBLIC_URL, the exact string the issuer binds sessions
        to (assertion `historyOrigin`/`aud`, default introspection audience,
        returned `baseUrl`); it is installation-wide, not per workspace.
      responses:
        "200":
          description: The workspace's RelayHistory origin and session audience
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [workspace, origin, audience]
                properties:
                  workspace:
                    type: string
                    description: The workspace id from the path
                  origin:
                    type: string
                    format: uri
                    description: Public RelayHistory origin, scheme://host[:port]
                  audience:
                    type: string
                    description: Audience the issuer binds this workspace's History sessions to
        "401":
          description: |
            `unauthorized`: missing, invalid, revoked or expired user access
            token, or a service, bootstrap or workspace API (`sh_wk_`) token.
        "403":
          description: |
            `handoff_not_exchanged`: the bearer is a Desktop sign-in handoff
            whose PKCE exchange (POST /api/v1/auth/desktop/session) has not
            happened. `forbidden`: the workspace is in the token's
            organization and the caller is a member, but the token is bound to
            another workspace.
        "404":
          description: |
            `workspace_not_found`: workspace does not exist, is outside the
            token's organization (even if the same person is a member there),
            or the caller is not a member. `relayhistory_not_configured`: RELAYHISTORY_URL
            or RELAYHISTORY_PUBLIC_URL is unset (checked after authorization).
  /api/v1/workspaces/{workspaceId}/relayhistory/session:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    post:
      operationId: issueRelayhistorySession
      description: |
        With RELAYAUTH_URL set (transitional): mints an assertion through the
        internal RelayAuth URL using the public RelayHistory HTTPS origin as
        `historyOrigin` and `aud`, validates its tenant/scope/audience claims,
        then exchanges it through the internal RelayHistory URL.

        Without RelayAuth: exchanges the caller's own access token (bearer or
        `/cloud` session cookie) at the internal RelayHistory URL; History
        verifies it through `POST /internal/v1/auth/introspect` and decides
        the granted `scopes` from the token session's scopes, so `mode` is
        enforced only here (sync requires `rth:sync`) and a read request may
        return a session with sync scopes. A sync request whose login reply
        lacks `rth:sync` answers 501 (see docs/sessions-read-api.md).

        In both modes the returned `baseUrl` is the public History origin.
        Caller-supplied service URLs or tenant IDs are rejected because they
        are not request fields.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                mode:
                  enum: [read, sync]
                  default: sync
                label:
                  type: string
                  maxLength: 120
      responses:
        "200":
          description: RelayHistory renewable session with the public History baseUrl
        "403":
          description: "mode_not_authorized: sync requested without rth:sync"
        "404":
          description: Workspace does not exist or is outside the bearer tenant
        "502":
          description: RelayAuth assertion or RelayHistory exchange failed
        "501":
          description: |
            `unsupported_by_backend` with reason `sync_not_served`: without
            RelayAuth, mode=sync was requested but History's login reply does
            not grant `rth:sync` (the self-host read API container serves
            reads only). No session is returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnsupportedByBackend"
  /api/v1/workspaces/{workspaceId}/session-read/session:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    post:
      operationId: issueSessionReadCredentials
      summary: Request credentials issued by the independent session read API.
      description: |
        Also served under /cloud. Requires a current user token, live membership
        in that token's workspace and rth:read. Pending Desktop handoffs are
        refused. Tenant, audience, scopes and service URLs come from resolved
        auth and operator configuration only. The reader issues and verifies
        its own tokens; Control stores none. Returned credentials are validated
        for the exact user/org/workspace/audience and only rth:read.
        Bearer clients receive a token pair. Cookie clients must use /cloud,
        JSON and the expected dashboard/API Origin (or same-origin fetch
        metadata), and receive no refresh fields. They renew by calling this
        endpoint again. Replies carry Cache-Control: no-store.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                label: { type: string, minLength: 1, maxLength: 128 }
      responses:
        "200":
          description: Reader-issued credentials with the configured public baseUrl.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionReadCredentials" }
        "400": { description: Invalid body or caller-supplied identity/scope/URL fields. }
        "401": { description: Missing, expired, revoked or non-user Control token. }
        "403": { description: Missing rth:read, pending Desktop handoff or failed browser CSRF check. }
        "404": { description: Unknown/foreign workspace or session_read_not_configured. }
        "429": { description: More than 30 credential requests per user/workspace per minute. }
        "502": { description: Reader unavailable or response failed identity/scope/token validation. }
        "503": { description: Reader refused because its credential backend is unavailable. }
  /api/v1/workspaces/{workspaceId}/session-read/refresh:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    post:
      operationId: refreshSessionReadCredentials
      summary: Ask the reader to rotate credentials after checking current membership.
      description: |
        Also served under /cloud. Requires a current user Control bearer and
        rth:read in the exact workspace, plus the reader refresh token. Cookie
        clients must request a new session instead. The reader checks the
        refresh token's exact identity/audience and rotates atomically. A 401
        requires sign-in again. Unavailable reads fail closed without fallback,
        retry or forwarding upstream error bodies. Cache-Control: no-store.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [refreshToken]
              properties:
                refreshToken: { type: string, minLength: 55, maxLength: 4096, pattern: '^rth_rt_read_[A-Za-z0-9_-]{43,}$' }
      responses:
        "200":
          description: Rotated reader-issued pair with the configured public baseUrl.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionReadCredentials" }
        "400": { description: Invalid refresh body or token format. }
        "401": { description: Invalid Control token or invalid_refresh_token. }
        "403": { description: Missing rth:read, pending handoff or cookie client. }
        "404": { description: Unknown/foreign workspace or session_read_not_configured. }
        "429": { description: Credential request rate limit exceeded. }
        "502": { description: Reader unavailable or invalid credential response. }
        "503": { description: Reader credential backend unavailable; no credentials returned. }
  # --- Relayflows (src/flows). Dashboard calls use the caller's current workspace.
  /api/v1/workers/enrollment-tokens:
    get:
      tags: [workers]
      operationId: listWorkerEnrollmentTokens
      description: Workspace owner/admin. Tokens are never returned after creation; only a hint.
      responses:
        "200":
          description: Recent enrollment tokens
          content:
            application/json:
              schema:
                type: object
                required: [tokens]
                properties:
                  tokens:
                    type: array
                    items:
                      $ref: "#/components/schemas/EnrollmentTokenSummary"
        "403":
          description: Workspace admin role required
    post:
      tags: [workers]
      operationId: createWorkerEnrollmentToken
      description: |
        Workspace owner/admin. Mints a single-use enrollment token (stored as a
        SHA-256 hash) for `agent-relay cloud worker register`. The plaintext
        token is returned only in this response.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                workspaceId:
                  type: string
                  format: uuid
                name:
                  type: string
                  maxLength: 128
                tags:
                  type: array
                  items:
                    type: string
                expiresInMinutes:
                  type: integer
                  minimum: 1
                  maximum: 10080
      responses:
        "200":
          description: Token issued (Cache-Control no-store)
          content:
            application/json:
              schema:
                type: object
                required: [id, token, expiresAt, createdAt, cloudUrl, registerCommand, startCommand]
                properties:
                  id:
                    type: string
                    format: uuid
                  token:
                    type: string
                    pattern: "^sh_wrk_enr_"
                  expiresAt:
                    type: string
                    format: date-time
                  createdAt:
                    type: string
                    format: date-time
                  cloudUrl:
                    type: string
                    format: uri
                  registerCommand:
                    type: string
                  startCommand:
                    type: string
        "403":
          description: Workspace admin role required
  /api/v1/workers/enrollment-tokens/{tokenId}:
    delete:
      tags: [workers]
      operationId: revokeWorkerEnrollmentToken
      parameters:
        - name: tokenId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Revoked
        "404":
          description: Unknown, used, or already revoked
  /api/v1/workers:
    get:
      tags: [workers]
      operationId: listWorkers
      responses:
        "200":
          description: Workers in the current workspace
          content:
            application/json:
              schema:
                type: object
                required: [workers]
                properties:
                  workers:
                    type: array
                    items:
                      $ref: "#/components/schemas/Worker"
  /api/v1/workers/{workerId}:
    parameters:
      - $ref: "#/components/parameters/WorkerId"
    get:
      tags: [workers]
      operationId: getWorker
      responses:
        "200":
          description: Worker
          content:
            application/json:
              schema:
                type: object
                required: [worker]
                properties:
                  worker:
                    $ref: "#/components/schemas/Worker"
        "404":
          description: Not in this workspace
    delete:
      tags: [workers]
      operationId: revokeWorker
      description: Workspace owner/admin. Revokes the worker token, fails its active work, and sends `revoke` on its queue stream.
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema:
                type: object
                required: [workerId, status]
                properties:
                  workerId:
                    type: string
                    format: uuid
                  status:
                    const: revoked
  /api/v1/workers/register:
    post:
      tags: [worker-protocol]
      operationId: registerWorker
      security: []
      description: Called by `agent-relay cloud worker register`. Consumes the enrollment token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enrollmentToken, name]
              properties:
                enrollmentToken:
                  type: string
                name:
                  type: string
                  maxLength: 128
                hostInfo:
                  type: object
      responses:
        "200":
          description: Registered
          content:
            application/json:
              schema:
                type: object
                required: [workerId, workerToken, heartbeatIntervalMs]
                properties:
                  workerId:
                    type: string
                    format: uuid
                  workerToken:
                    type: string
                    pattern: "^sh_wrk_"
                  heartbeatIntervalMs:
                    type: integer
        "401":
          description: Invalid, used, revoked, or expired enrollment token
        "409":
          description: Worker name already exists in the workspace
  /api/v1/workers/{workerId}/heartbeat:
    parameters:
      - $ref: "#/components/parameters/WorkerId"
    post:
      tags: [worker-protocol]
      operationId: workerHeartbeat
      security:
        - workerToken: []
      responses:
        "200":
          description: Recorded
          content:
            application/json:
              schema:
                type: object
                required: [ok, nextHeartbeatMs]
                properties:
                  ok:
                    const: true
                  nextHeartbeatMs:
                    type: integer
        "401":
          description: Invalid or revoked worker token
  /api/v1/workers/{workerId}/queue:
    parameters:
      - $ref: "#/components/parameters/WorkerId"
    get:
      tags: [worker-protocol]
      operationId: workerQueue
      security:
        - workerToken: []
      description: |
        Server-sent events. `event: ping` (data `{}`) on connect and every
        SELFHOST_FLOWS_QUEUE_PING_MS; `event: assignment` (data
        WorkAssignment); `event: revoke` then close. Assigned but
        unacknowledged work is redelivered on reconnect. A worker holds at
        most one assigned/running assignment at a time.
      responses:
        "200":
          description: Event stream
          content:
            text/event-stream:
              schema:
                type: string
  /api/v1/workers/{workerId}/assignments/{runId}/ack:
    parameters:
      - $ref: "#/components/parameters/WorkerId"
      - $ref: "#/components/parameters/RunId"
    post:
      tags: [worker-protocol]
      operationId: ackAssignment
      security:
        - workerToken: []
      responses:
        "200":
          description: Acknowledged (idempotent)
        "404":
          description: Not assigned to this worker
        "409":
          description: The run was cancelled before acknowledgement
  /api/v1/workers/{workerId}/assignments/{runId}/status:
    parameters:
      - $ref: "#/components/parameters/WorkerId"
      - $ref: "#/components/parameters/RunId"
    post:
      tags: [worker-protocol]
      operationId: reportAssignmentStatus
      security:
        - workerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phase]
              properties:
                phase:
                  enum: [running, completed, failed]
                exitCode:
                  type: integer
                durationMs:
                  type: integer
                summary:
                  type: string
                error:
                  type: string
                result:
                  type: object
      responses:
        "200":
          description: Recorded; reports after a terminal state are returned unchanged
        "404":
          description: Not assigned to this worker
  /api/v1/workers/{workerId}/assignments/{runId}/cli-credentials:
    parameters:
      - $ref: "#/components/parameters/WorkerId"
      - $ref: "#/components/parameters/RunId"
      - $ref: "#/components/parameters/CliCredentialRef"
    get:
      operationId: workerReadCliCredentials
      description: |
        The assigned worker (worker bearer token) plus the run's short-lived
        reference from the assignment payload (`cliCredentials.ref`, header
        X-Cli-Credential-Ref). Returns each selected subscription login as the
        auth file its CLI reads (Codex `$CODEX_HOME/auth.json`, Grok
        `$GROK_HOME/auth.json`), refreshed first when it expires within 45
        minutes. The reference is revoked when the run finishes. The worker
        writes the files 0600 into the run's private directory and deletes them
        with it; it never logs them.
      responses:
        "200":
          description: Auth files for the run
          content:
            application/json:
              schema:
                type: object
                properties:
                  files:
                    type: array
                    items:
                      type: object
                      properties:
                        credentialId: { type: string, format: uuid }
                        provider: { enum: [openai, xai] }
                        cli: { enum: [codex, grok] }
                        homeEnv: { enum: [CODEX_HOME, GROK_HOME] }
                        directory: { type: string }
                        file: { type: string }
                        content: { type: string, description: "Secret. The auth file JSON." }
                  skipped:
                    type: array
                    items:
                      type: object
                      properties:
                        credentialId: { type: string }
                        reason: { type: string }
        "401": { description: Missing or invalid worker token or reference }
        "404": { description: Not this worker's active assignment }
  /api/v1/workers/{workerId}/assignments/{runId}/cli-credentials/{credentialId}:
    parameters:
      - $ref: "#/components/parameters/WorkerId"
      - $ref: "#/components/parameters/RunId"
      - $ref: "#/components/parameters/CliCredentialRef"
      - name: credentialId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      operationId: workerWriteBackCliCredential
      description: |
        Write-back after a run when the CLI refreshed its own tokens. Accepted
        only for a login the reference covers, for the same provider account,
        and never over a newer stored login.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string, writeOnly: true }
      responses:
        "200":
          description: Stored (updated) or unchanged
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated: { type: boolean }
        "409": { description: Auth file belongs to a different account }
        "422": { description: Not a valid auth file for the provider }
  /api/v1/workers/{workerId}/assignments/{runId}/storage/{objectKey}:
    parameters:
      - $ref: "#/components/parameters/WorkerId"
      - $ref: "#/components/parameters/RunId"
      - $ref: "#/components/parameters/ObjectKey"
    get:
      tags: [worker-protocol]
      operationId: getAssignmentObject
      security:
        - workerToken: []
      description: Readable while the assignment is assigned or running (for example `code.tar.gz`).
      responses:
        "200":
          description: Object bytes
        "404":
          description: Unknown object or assignment
    head:
      tags: [worker-protocol]
      operationId: headAssignmentObject
      security:
        - workerToken: []
      responses:
        "200":
          description: Exists
        "404":
          description: Missing
    put:
      tags: [worker-protocol]
      operationId: putAssignmentObject
      security:
        - workerToken: []
      description: Upload a log or artifact (max 8 MiB). `code.tar.gz` is read-only.
      requestBody:
        content:
          application/octet-stream: {}
      responses:
        "200":
          description: Stored
  /api/v1/flows:
    get:
      tags: [flows]
      operationId: listFlows
      responses:
        "200":
          description: Flow definitions
          content:
            application/json:
              schema:
                type: object
                required: [flows]
                properties:
                  flows:
                    type: array
                    items:
                      $ref: "#/components/schemas/Flow"
    post:
      tags: [flows]
      operationId: createFlow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FlowInput"
      responses:
        "201":
          description: Created
        "409":
          description: Name already used in the workspace
  /api/v1/flows/{flowId}:
    parameters:
      - $ref: "#/components/parameters/FlowId"
    get:
      tags: [flows]
      operationId: getFlow
      responses:
        "200":
          description: Flow with source, declared steps, and its 20 most recent runs
    patch:
      tags: [flows]
      operationId: updateFlow
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FlowInput"
      responses:
        "200":
          description: Updated
    delete:
      tags: [flows]
      operationId: deleteFlow
      responses:
        "200":
          description: Deleted (existing runs are kept)
  /api/v1/flows/{flowId}/invoke:
    parameters:
      - $ref: "#/components/parameters/FlowId"
    post:
      tags: [flows]
      operationId: invokeFlow
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunOptions"
      responses:
        "201":
          description: Run queued for a worker
  /api/v1/workflows/run:
    post:
      tags: [runs]
      operationId: createRun
      description: Queue an ad-hoc workflow (or `flowId`) for a worker. `resume` re-queues a finished run.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/RunOptions"
                - type: object
                  properties:
                    workflow:
                      type: string
                    fileType:
                      enum: [yaml, ts]
                    name:
                      type: string
                    workflowFileName:
                      type: string
                    flowId:
                      type: string
                      format: uuid
                    resume:
                      type: string
                      format: uuid
                    startFrom:
                      type: string
                    codeArchiveBase64:
                      type: string
                      description: gzip tarball served to the worker as `s3CodeKey` `code.tar.gz`
      responses:
        "201":
          description: Queued
          content:
            application/json:
              schema:
                type: object
                required: [runId, status]
                properties:
                  runId:
                    type: string
                    format: uuid
                  status:
                    const: pending
                  assignmentId:
                    type: string
                  dispatchedTo:
                    type: [string, "null"]
        "400":
          description: Invalid body, or a runtime other than `worker`
        "404":
          description: Requested worker or flow not found
  /api/v1/workflows/runs:
    get:
      tags: [runs]
      operationId: listRuns
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            maximum: 100
        - name: flowId
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/RunStatus"
      responses:
        "200":
          description: Newest first
          content:
            application/json:
              schema:
                type: object
                required: [runs, nextCursor, totalRuns, activeRuns, failedRuns]
                properties:
                  runs:
                    type: array
                    items:
                      $ref: "#/components/schemas/Run"
                  nextCursor:
                    type: [string, "null"]
                  totalRuns:
                    type: integer
                  activeRuns:
                    type: integer
                  failedRuns:
                    type: integer
                  needsReviewRuns:
                    type: integer
  /api/v1/workflows/runs/{runId}:
    parameters:
      - $ref: "#/components/parameters/RunId"
    get:
      tags: [runs]
      operationId: getRun
      responses:
        "200":
          description: Run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "404":
          description: Not in this workspace
  /api/v1/workflows/runs/{runId}/workflow:
    parameters:
      - $ref: "#/components/parameters/RunId"
    get:
      tags: [runs]
      operationId: getRunWorkflow
      responses:
        "200":
          description: The exact definition the run executed
  /api/v1/workflows/runs/{runId}/cancel:
    parameters:
      - $ref: "#/components/parameters/RunId"
    post:
      tags: [runs]
      operationId: cancelRun
      description: |
        Withdraws queued work immediately. Work already on a worker cannot be
        interrupted over the assignment protocol; the run is marked cancelled
        and the worker's later report does not change it.
      responses:
        "200":
          description: Cancelled
        "409":
          description: Run already finished
  /api/v1/workflows/runs/{runId}/resume:
    parameters:
      - $ref: "#/components/parameters/RunId"
    post:
      tags: [runs]
      operationId: resumeRun
      description: Re-queue a finished worker run as a new linked run, optionally from `startFrom`.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                startFrom:
                  type: string
                workerId:
                  type: string
                  format: uuid
      responses:
        "201":
          description: New run queued
        "409":
          description: Run not finished, or a locally mirrored run
  /api/v1/workflows/runs/{runId}/retry:
    parameters:
      - $ref: "#/components/parameters/RunId"
    post:
      tags: [runs]
      operationId: retryRun
      responses:
        "201":
          description: New run queued from the start
  /api/v1/workflows/runs/{runId}/steps:
    parameters:
      - $ref: "#/components/parameters/RunId"
    get:
      tags: [runs]
      operationId: listRunSteps
      description: |
        `source: reported` when the runtime mirrored steps; otherwise
        `declared` steps parsed from the YAML definition with a status
        inferred from the run (`completed`, `pending`, or `unknown`).
      responses:
        "200":
          description: Steps
          content:
            application/json:
              schema:
                type: object
                required: [steps, source, live]
                properties:
                  source:
                    enum: [reported, declared, none]
                  live:
                    type: boolean
                  steps:
                    type: array
                    items:
                      $ref: "#/components/schemas/Step"
    post:
      tags: [run-ingestion]
      operationId: reportFinalSteps
      security:
        - runToken: []
      description: v2 cloud-mirror final step report; replaces all step rows.
      responses:
        "201":
          description: Stored
  /api/v1/workflows/runs/{runId}/steps/snapshot:
    parameters:
      - $ref: "#/components/parameters/RunId"
    post:
      tags: [run-ingestion]
      operationId: reportStepSnapshot
      security:
        - runToken: []
      responses:
        "202":
          description: Accepted
        "409":
          description: Run already finished
  /api/v1/workflows/runs/{runId}/events:
    parameters:
      - $ref: "#/components/parameters/RunId"
    get:
      tags: [runs]
      operationId: listRunEvents
      parameters:
        - name: after
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
            maximum: 1000
        - name: sort
          in: query
          schema:
            enum: [asc, desc]
      responses:
        "200":
          description: Control-plane lifecycle events (run.queued, run.assigned, run.acknowledged, run.running, run.completed|failed|cancelled) plus mirrored runtime events
    post:
      tags: [run-ingestion]
      operationId: appendRunEvent
      security:
        - runToken: []
      responses:
        "201":
          description: Appended with the next per-run sequence
  /api/v1/workflows/runs/{runId}/storage/{objectKey}:
    parameters:
      - $ref: "#/components/parameters/RunId"
      - $ref: "#/components/parameters/ObjectKey"
    put:
      tags: [run-ingestion]
      operationId: putRunObject
      security:
        - runToken: []
      description: Upload `runner.log`, `<step>/agent.log`, or an artifact. Honors `If-None-Match "*"`.
      responses:
        "200":
          description: Stored
        "412":
          description: Object exists and If-None-Match was "*"
  /api/v1/workflows/runs/{runId}/logs:
    parameters:
      - $ref: "#/components/parameters/RunId"
    get:
      tags: [runs]
      operationId: readRunLog
      parameters:
        - name: offset
          in: query
          schema:
            type: integer
        - name: file
          in: query
          schema:
            type: string
            default: runner.log
        - name: step
          in: query
          description: Reads `<step>/agent.log` instead of `file`
          schema:
            type: string
      responses:
        "200":
          description: Incremental log page (256 KiB max)
          content:
            application/json:
              schema:
                type: object
                required: [content, offset, totalSize, done, available]
                properties:
                  content:
                    type: string
                  offset:
                    type: integer
                  totalSize:
                    type: integer
                  done:
                    type: boolean
                  available:
                    type: boolean
                  reset:
                    type: boolean
  /api/v1/workflows/runs/{runId}/artifacts:
    parameters:
      - $ref: "#/components/parameters/RunId"
    get:
      tags: [runs]
      operationId: listRunArtifacts
      responses:
        "200":
          description: Stored objects with kind log, code, or artifact
  /api/v1/workflows/runs/{runId}/artifacts/{objectKey}:
    parameters:
      - $ref: "#/components/parameters/RunId"
      - $ref: "#/components/parameters/ObjectKey"
    get:
      tags: [runs]
      operationId: downloadRunArtifact
      description: Served as an attachment with nosniff and a sandbox CSP.
      responses:
        "200":
          description: Object bytes
  /api/v1/workflows/local-run:
    post:
      tags: [run-ingestion]
      operationId: registerLocalRun
      description: |
        v2 cloud-mirror registration (`flows run` with FLOWS_CLOUD_URL /
        FLOWS_CLOUD_TOKEN). Returns a run-bound ingestion token and callback
        token; both are stored hashed and never returned again.
      responses:
        "201":
          description: Local run registered
  /api/v1/workflows/callback:
    post:
      tags: [run-ingestion]
      operationId: runCallback
      security:
        - runToken: []
      description: Terminal status for a mirrored run. `callbackToken` must match.
      responses:
        "200":
          description: Recorded
        "401":
          description: Invalid run or callback token
        "409":
          description: Non-terminal status or already finished differently
  # --- admin lane: environment variables, provider connections, API tokens ---
  /api/v1/organizations/{organizationId}:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    patch:
      operationId: renameOrganization
      description: Organization owner/admin. Name is normalized (control characters removed, whitespace collapsed), 1-80 characters.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 80 }
      responses:
        "200":
          description: Renamed
          content:
            application/json:
              schema:
                type: object
                properties:
                  organization:
                    type: object
                    properties:
                      id: { type: string }
                      name: { type: string }
        "403": { description: Owner/admin role required }
  /api/v1/workspaces/{workspaceId}/cloud-agents:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: listCodingAgentCredentials
      description: |
        Any workspace member. Settings > Connections > "Coding agents" (hosted
        GET /api/v1/cloud-agents?scope=workspace). Returns metadata and a masked
        secretPreview only; secrets are never returned.
      responses:
        "200":
          description: Credentials and the provider catalog
          content:
            application/json:
              schema:
                type: object
                properties:
                  agents:
                    type: array
                    items: { $ref: "#/components/schemas/CodingAgentCredential" }
                  providers:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        displayName: { type: string }
                        harness: { type: string }
                        envName: { type: string }
                        authTypes:
                          type: array
                          items: { enum: [byo_api_key, oauth_token, provider_oauth] }
                        keyPlaceholder: { type: string }
                        docsUrl: { type: string }
                  canManage: { type: boolean }
  /api/v1/workspaces/{workspaceId}/provider-credentials/byok:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    post:
      operationId: putCodingAgentApiKey
      description: |
        Owner/admin. Stores a model-provider API key (anthropic, openai,
        openrouter, xai, google; aliases claude, codex, grok, gemini),
        encrypted with SELFHOST_ENCRYPTION_KEY. The same key stored again
        returns the existing credential (200). The provider's first credential
        gets LLM call access. Cookie-authenticated calls must send application/json.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [modelProvider, key]
              properties:
                modelProvider: { type: string }
                key: { type: string, writeOnly: true }
                label: { type: string, maxLength: 80 }
      responses:
        "201": { $ref: "#/components/responses/CodingAgentStored" }
        "200": { $ref: "#/components/responses/CodingAgentStored" }
        "400": { description: Invalid provider, key or label }
        "403": { description: Not a workspace owner/admin }
  /api/v1/workspaces/{workspaceId}/provider-credentials/setup-token:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    post:
      operationId: putCodingAgentSetupToken
      description: |
        Owner/admin. Stores a `claude setup-token`. A token for an account email
        already stored replaces that account's token (200); a different email
        adds another account. The first setup token gets sandbox access and is
        delivered to flow runs as CLAUDE_CODE_OAUTH_TOKEN.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, writeOnly: true }
                accountEmail: { type: string, format: email }
                label: { type: string, maxLength: 80 }
      responses:
        "201": { $ref: "#/components/responses/CodingAgentStored" }
        "200": { $ref: "#/components/responses/CodingAgentStored" }
        "400": { description: Invalid token or accountEmail }
        "403": { description: Not a workspace owner/admin }
  /api/v1/workspaces/{workspaceId}/provider-credentials/openai-device/start:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    post:
      operationId: startOpenaiDeviceLogin
      description: |
        Owner/admin. Starts a Codex (ChatGPT) device login (hosted provider-credentials/openai-device/start).
        No hosted callback: the operator approves the one-time code at https://auth.openai.com/codex/device
        and this control plane exchanges it. Sets an httpOnly SameSite=Strict
        browser-binding cookie; at most 5 starts per 5 minutes.
      responses:
        "201":
          description: Device login started
          content:
            application/json:
              schema:
                type: object
                properties:
                  transactionId: { type: string, format: uuid }
                  verificationUri: { type: string }
                  userCode: { type: string }
                  intervalSeconds: { type: integer }
                  expiresAt: { type: string, format: date-time }
        "429": { description: Too many login attempts }
        "502": { description: The provider did not start a login }
  /api/v1/workspaces/{workspaceId}/provider-credentials/openai-device/status:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    post:
      operationId: pollOpenaiDeviceLogin
      description: |
        Owner/admin, from the browser that started the login (binding cookie).
        Polls the provider at most once per its interval. On approval the auth
        file is stored envelope-encrypted and the login becomes a
        `provider_oauth` coding-agent credential with sandbox access.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [transactionId]
              properties:
                transactionId: { type: string, format: uuid }
      responses:
        "200":
          description: Login state
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { enum: [pending, connected, expired, failed] }
                  retryAfterSeconds: { type: integer }
                  providerCredentialId: { type: string, format: uuid }
        "404": { description: Unknown login or a different browser }
  /api/v1/workspaces/{workspaceId}/provider-credentials/xai-device/start:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    post:
      operationId: startXaiDeviceLogin
      description: |
        Owner/admin. Starts a Grok (xAI) device login (hosted provider-credentials/xai-device/start).
        No hosted callback: the operator approves the one-time code at https://accounts.x.ai/oauth2/device
        and this control plane exchanges it. Sets an httpOnly SameSite=Strict
        browser-binding cookie; at most 5 starts per 5 minutes.
      responses:
        "201":
          description: Device login started
          content:
            application/json:
              schema:
                type: object
                properties:
                  transactionId: { type: string, format: uuid }
                  verificationUri: { type: string }
                  userCode: { type: string }
                  intervalSeconds: { type: integer }
                  expiresAt: { type: string, format: date-time }
        "429": { description: Too many login attempts }
        "502": { description: The provider did not start a login }
  /api/v1/workspaces/{workspaceId}/provider-credentials/xai-device/status:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    post:
      operationId: pollXaiDeviceLogin
      description: |
        Owner/admin, from the browser that started the login (binding cookie).
        Polls the provider at most once per its interval. On approval the auth
        file is stored envelope-encrypted and the login becomes a
        `provider_oauth` coding-agent credential with sandbox access.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [transactionId]
              properties:
                transactionId: { type: string, format: uuid }
      responses:
        "200":
          description: Login state
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { enum: [pending, connected, expired, failed] }
                  retryAfterSeconds: { type: integer }
                  providerCredentialId: { type: string, format: uuid }
        "404": { description: Unknown login or a different browser }
  /api/v1/workspaces/{workspaceId}/cloud-agents/{agentId}/activate:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/AgentId"
    post:
      operationId: selectCodingAgentCredential
      description: |
        Owner/admin. `model` gives this credential its provider's LLM call
        access; `harness` gives it sandbox access (setup tokens only). Exactly
        one credential per provider holds each selection.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                selection: { enum: [model, harness], default: model }
      responses:
        "200":
          description: Selected
          content:
            application/json:
              schema:
                type: object
                properties:
                  agent: { $ref: "#/components/schemas/CodingAgentCredential" }
        "404": { description: Credential not found in this workspace }
        "409": { description: Credential not connected, or sandbox access not supported }
  /api/v1/workspaces/{workspaceId}/cloud-agents/{agentId}/check:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/AgentId"
    post:
      operationId: checkCodingAgentCredential
      description: |
        Owner/admin. Makes one authenticated read against the provider. A
        rejected key is marked `error` and is not delivered to runs until a
        later check succeeds. Setup tokens return `unsupported`.
      responses:
        "200":
          description: Check result
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { enum: [available, unavailable, unsupported, error] }
                  checkedAt: { type: string, format: date-time }
                  message: { type: string }
  /api/v1/workspaces/{workspaceId}/cloud-agents/{agentId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/AgentId"
    delete:
      operationId: deleteCodingAgentCredential
      description: |
        Owner/admin. Deletes the credential. A selection it held moves to the
        provider's most recent remaining eligible credential.
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { const: true }
                  id: { type: string }
        "404": { description: Credential not found in this workspace }
  /api/v1/workspaces/{workspaceId}/secrets:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: listWorkspaceEnvVars
      description: Any workspace member. Values are write-only; only maskedValue is returned.
      responses:
        "200":
          description: Environment variables
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { const: true }
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/WorkspaceEnvVar" }
    post:
      operationId: putWorkspaceEnvVar
      description: |
        Owner/admin. Creates or replaces a variable (hosted semantics: no PUT).
        Cookie-authenticated calls must send application/json. Values are
        encrypted with SELFHOST_ENCRYPTION_KEY and never returned again.
        Limits: name ^[A-Za-z_][A-Za-z0-9_]{0,127}$, value <= 32 KiB, no NUL,
        <= 200 variables and <= 256 KiB total per workspace. Names that alter
        process startup (PATH, LD_*, NODE_OPTIONS, proxies, Git helpers, ...) and
        sandbox-provider credentials (E2B_*, DAYTONA_*, ...) are refused.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, value]
              properties:
                name: { type: string }
                envVar: { type: string, description: Must equal name when present }
                value: { type: string, writeOnly: true }
                kind: { const: environment }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceEnvVar" }
        "200":
          description: Replaced
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceEnvVar" }
        "400": { description: invalid_workspace_secret }
        "403": { description: Owner/admin role required }
        "415": { description: Cookie-authenticated writes must be JSON }
  /api/v1/workspaces/{workspaceId}/secrets/{name}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - name: name
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getWorkspaceEnvVar
      responses:
        "200":
          description: Variable metadata (masked)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceEnvVar" }
        "404": { description: secret_not_found }
    delete:
      operationId: deleteWorkspaceEnvVar
      description: Owner/admin.
      responses:
        "200":
          description: Deleted variable metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceEnvVar" }
        "403": { description: Owner/admin role required }
        "404": { description: secret_not_found }
  /api/v1/integrations/catalog:
    get:
      security: []
      operationId: integrationCatalog
      description: Provider registry. Compatible with `relayfile integration available`.
      responses:
        "200":
          description: Catalog
          content:
            application/json:
              schema:
                type: object
                properties:
                  version: { type: string }
                  providers:
                    type: array
                    items: { $ref: "#/components/schemas/IntegrationProvider" }
  /api/v1/integrations/oauth/callback:
    get:
      security: []
      operationId: integrationOAuthCallback
      description: |
        OAuth authorization-code redirect target registered in each provider's
        OAuth app (SELFHOST_OAUTH_REDIRECT_URL). State is single-use, expires
        after 10 minutes, and is stored hashed. Renders an HTML result page.
      parameters:
        - { name: state, in: query, required: true, schema: { type: string } }
        - { name: code, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
      responses:
        "200": { description: Connected (text/html) }
        "400": { description: Invalid/expired state or provider denied (text/html) }
        "502": { description: Provider token exchange failed (text/html) }
  /api/v1/workspaces/{workspaceId}/integrations:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: listIntegrations
      description: Any member. Bare array, as hosted (relayfile CLI `integration list`).
      responses:
        "200":
          description: Connections (no tokens)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/IntegrationConnection" }
  /api/v1/workspaces/{workspaceId}/integrations/providers:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: listIntegrationProviders
      description: Any member. Catalog joined with this workspace's OAuth app configuration and connection.
      responses:
        "200":
          description: Providers
          content:
            application/json:
              schema:
                type: object
                properties:
                  redirectUri: { type: string, format: uri }
                  canManage: { type: boolean }
                  providers:
                    type: array
                    items:
                      allOf:
                        - $ref: "#/components/schemas/IntegrationProvider"
                        - type: object
                          properties:
                            configured: { type: boolean }
                            oauthApp:
                              oneOf:
                                - $ref: "#/components/schemas/OAuthApp"
                                - type: "null"
                            connection:
                              oneOf:
                                - $ref: "#/components/schemas/IntegrationConnection"
                                - type: "null"
  /api/v1/workspaces/{workspaceId}/integrations/connect-session:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    post:
      operationId: createIntegrationConnectSession
      description: |
        Any workspace member. The just-in-time entry point for the CLI
        (`agent-relay cloud integration connect`, relayfile setup), flow
        onboarding and flow creation. Starts the OAuth authorization-code flow
        (PKCE where the provider supports it) with the operator's OAuth app
        (SELFHOST_OAUTH_<PROVIDER>_CLIENT_ID/_CLIENT_SECRET, chart
        relay-cloud-api.integrations.<provider>.existingSecret), falling back to
        a per-workspace app stored through the oauth-app route. Open connectLink
        in a browser; the provider redirects to the callback, whose page links
        back to returnTo. 409 oauth_app_not_configured carries the message
        "Your administrator needs to configure the <Provider> app before it can
        be connected."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [allowedIntegrations]
              properties:
                allowedIntegrations:
                  type: array
                  minItems: 1
                  maxItems: 1
                  items: { type: string, description: Provider id or hosted config key }
                requestedBackend: { const: selfhost }
                returnTo:
                  type: string
                  description: Dashboard URL (same origin as SELFHOST_DASHBOARD_URL) the callback page links back to; other origins are ignored.
      responses:
        "200":
          description: Connect session
          content:
            application/json:
              schema:
                type: object
                properties:
                  connectLink: { type: string, format: uri }
                  expiresAt: { type: string, format: date-time }
                  workspaceId: { type: string }
                  relayWorkspaceId: { type: string, description: The workspace's Relaycast id (agent-relay CLI shape). }
                  backend: { const: selfhost }
                  backendIntegrationId: { type: string }
        "400": { description: Provider uses an API key, or invalid request }
        "403": { description: Not a member of the workspace }
        "409": { description: unknown_provider or oauth_app_not_configured }
  /api/v1/workspaces/{workspaceId}/integrations/{provider}/oauth-app:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/Provider"
    put:
      operationId: putIntegrationOAuthApp
      description: Owner/admin. clientSecret is required on first save and optional afterwards (kept when omitted). It is encrypted and never returned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientId]
              properties:
                clientId: { type: string }
                clientSecret: { type: string, writeOnly: true }
                scopes:
                  description: Overrides the provider default scopes; null restores defaults.
                  oneOf:
                    - type: array
                      items: { type: string }
                    - type: "null"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OAuthApp" }
    delete:
      operationId: deleteIntegrationOAuthApp
      description: Owner/admin. Existing connections keep working until their tokens need a refresh.
      responses:
        "200": { description: Deleted }
        "404": { description: oauth_app_not_found }
  /api/v1/workspaces/{workspaceId}/integrations/{provider}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/Provider"
    get:
      operationId: getIntegration
      responses:
        "200":
          description: Connection (no tokens)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IntegrationConnection" }
        "404": { description: integration_not_found }
    post:
      operationId: connectApiKeyIntegration
      description: Owner/admin. API-key providers only; fields come from the catalog's credentialFields. Secret fields are encrypted and never returned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credentials]
              properties:
                credentials:
                  type: object
                  additionalProperties: { type: string }
      responses:
        "201":
          description: Connected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IntegrationConnection" }
    delete:
      operationId: disconnectIntegration
      description: Owner/admin. Idempotent. Deletes stored tokens; revoke the grant in the provider if required.
      responses:
        "200":
          description: Disconnected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DisconnectResult" }
  /api/v1/workspaces/{workspaceId}/integrations/{provider}/status:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/Provider"
    get:
      operationId: integrationStatus
      description: Readiness for CLI polling (relayfile `integration connect`).
      parameters:
        - { name: connectionId, in: query, schema: { type: string } }
      responses:
        "200": { description: "{ready, provider, state, connectionId, connectionMatched, oauth}" }
    delete:
      operationId: disconnectIntegrationStatus
      description: Alias of DELETE /integrations/{provider} (relayfile `integration disconnect`).
      responses:
        "200":
          description: Disconnected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DisconnectResult" }
  /api/v1/workspaces/{workspaceId}/deployment-api-tokens:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: listWorkspaceApiTokens
      description: Owner/admin.
      responses:
        "200":
          description: Tokens (never the token value)
          content:
            application/json:
              schema:
                type: object
                properties:
                  tokens:
                    type: array
                    items: { $ref: "#/components/schemas/WorkspaceApiToken" }
    post:
      operationId: createWorkspaceApiToken
      description: |
        Owner/admin. purpose agent-runtime grants runtime:env:read and
        runtime:integrations:read; workflow adds workflow scopes and may set
        neverExpires; deployment grants deployments:ci:*. relayfile-agent
        grants exactly fs:read, fs:write, sync:read and sync:trigger (never
        admin scopes), may set neverExpires, and requires agent_name and aud;
        relayfile verifies it through POST /internal/v1/auth/introspect.
        acquisition-operator grants exactly acquisition:operate, may set
        neverExpires, requires aud and refuses agent_name; an operator
        service presents it to RelayHistory, which verifies it through
        POST /internal/v1/auth/introspect as a `service` principal. Several
        acquisition-operator tokens may coexist in a workspace. These routes
        (also served at /cloud/api/v1) are the only way to mint or revoke
        one: a workspace owner/admin user token, never a workspace API token,
        the internal service token or the bootstrap token (401). agent_name
        is a 400 for any purpose but relayfile-agent, aud a 400 for any
        purpose but relayfile-agent and acquisition-operator, and scope or
        scopes a 400 for every purpose (scopes are fixed by purpose).
        neverExpires is a 400 for agent-runtime and deployment. expiryDays
        1-365, default 90. accessToken (sh_wk_...) is returned only here.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties:
                label: { type: string, maxLength: 128 }
                purpose: { enum: [agent-runtime, workflow, deployment, relayfile-agent, acquisition-operator] }
                expiryDays: { type: integer, minimum: 1, maximum: 365 }
                neverExpires:
                  type: boolean
                  description: >-
                    workflow, relayfile-agent and acquisition-operator only; cannot be
                    combined with expiryDays.
                agent_name:
                  type: string
                  pattern: "^[A-Za-z0-9._:-]{1,200}$"
                  description: >-
                    relayfile-agent only, required. The agent the token speaks for;
                    unique per workspace among non-revoked relayfile-agent tokens
                    (409 agent_name_conflict otherwise).
                aud:
                  type: string
                  description: >-
                    relayfile-agent and acquisition-operator only, required for both.
                    The service origin the token may be presented to (relayfile for
                    relayfile-agent, RelayHistory for acquisition-operator); must
                    normalize to one of the accepted introspection audiences
                    (GET /readyz introspection.audiences). Stored normalized. A 400
                    while introspection is disabled.
      responses:
        "201":
          description: Created; accessToken shown once
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/WorkspaceApiToken"
                  - type: object
                    properties:
                      accessToken: { type: string }
        "400": { description: "invalid_request: bad label, purpose, expiry, agent_name or aud, or a scope/scopes field (scopes are fixed by purpose)" }
        "409": { description: "agent_name_conflict: a non-revoked relayfile-agent token already uses this agent_name" }
  /api/v1/workspaces/{workspaceId}/deployment-api-tokens/{tokenId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - { name: tokenId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      operationId: revokeWorkspaceApiToken
      description: Owner/admin.
      responses:
        "204": { description: Revoked }
        "404": { description: token_not_found }
  /api/v1/workspaces/{workspaceId}/admin/audit:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: listAdminAudit
      description: Owner/admin. Most recent 100 admin events. Never contains secret values.
      responses:
        "200":
          description: Events
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        actorKind: { enum: [user, service, bootstrap] }
                        actorId: { type: [string, "null"] }
                        action: { type: string }
                        target: { type: [string, "null"] }
                        createdAt: { type: string, format: date-time }
  /internal/v1/auth/introspect:
    post:
      tags: [internal]
      operationId: introspectAccessToken
      security:
        - introspectAuth: []
      description: |
        For RelayHistory (and relayfile) pods only: verifies a relaycontrol
        user access token (`sh_at_`), or a relayfile-agent or
        acquisition-operator workspace API token (`sh_wk_`), presented to them, replacing the RelayAuth
        JWT in a RelayAuth-free install. Enabled only while
        RELAYCONTROL_INTROSPECT_SECRET is set; otherwise 404 like an unknown
        route. Nothing is cached here; the token session row is read on every
        call.

        Checks, in order: `wrong-kind` (not an `sh_at_` token: refresh,
        internal, bootstrap, worker or run tokens are never looked up; an
        `sh_wk_` token is only accepted as described below), `unknown` (no such token, including a token replaced by refresh),
        `revoked`, `expired`, `audience` (`aud` is not one of
        SELFHOST_INTROSPECT_AUDIENCES, compared as normalized origins:
        scheme, lowercase host and port; path ignored), `workspace` (the token
        session is bound to another workspace; only when `workspace` is
        supplied). Only then, when `machine` is
        supplied, it is matched against fleet node claims
        (POST /api/v1/fleet/nodes/claim), so an inactive token never reveals
        machine state: `machine_not_owned` (claimed by another user in the
        token's workspace), `machine_workspace_mismatch` (no claim in the
        token's workspace, but one in another workspace of the install),
        `machine_unclaimed` (no claim anywhere).

        `machine_id` is the verified machine when `machine` was supplied and
        the token's user claimed that node in the token's workspace, and null
        when `machine` was absent (a read-only principal). RelayHistory takes
        the machine id only from this response, never from its own caller.

        `workspace` is optional (contract v1.2). A token session is bound to
        exactly one workspace: when `workspace` is absent or null, the
        response `workspace` is the session's workspace and is authoritative
        for the caller, and no `workspace` reason is produced. The machine
        check always uses the session's workspace.

        `token_id` is stable for one access token and changes on every
        refresh. `iat` is the last refresh (or creation) time and `exp` the
        access token expiry, both epoch seconds. `scopes` are the token
        session's scopes verbatim: `cli:auth`, `rth:read`, `rth:sync` and
        `rth:acquire` for Desktop-issued sessions (device flow, the Desktop
        browser handoff and its exchange; handoff sessions also carry
        `desktop:workspaces`); dashboard browser sessions carry `cli:auth`,
        `rth:read`, `rth:sync`, `account`. A refresh keeps the session's scopes.

        Agent and service principals: an `sh_wk_` token is looked up only as a
        workspace API token of purpose relayfile-agent or acquisition-operator;
        any other `sh_wk_` (unknown, another purpose, revoked or not) is
        `wrong-kind`. Then `revoked`,
        `expired`, `audience` (`aud` must normalize to the token's stored aud,
        which must still be an accepted audience) and `workspace` as above.
        An agent has no machine: any `machine` is `machine_not_owned`. The
        active answer has principal_type `agent`, `sub` = `token_id` = the
        token id, `email` and `machine_id` null, `agent_name` set, `scopes`
        the token's (fs:read, fs:write, sync:read, sync:trigger), `aud` the
        stored audience, `iat` the mint time, and `exp` the token's expiry or,
        for a token without one, now + 3600 recomputed on every call (so a
        caller must re-introspect within that window). An acquisition-operator
        token passes the same checks and answers the same way except
        principal_type `service`, `agent_name` null and `scopes`
        `["acquisition:operate"]`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, aud]
              properties:
                token: { type: string, description: The end-user token presented to the calling service }
                aud: { type: string, description: The calling service's configured origin }
                workspace:
                  type: [string, "null"]
                  minLength: 1
                  description: >-
                    Optional. The workspace the caller is about to serve; trimmed, must equal
                    the token session's workspace. Absent or null: not checked, and the
                    response `workspace` is authoritative. Empty, whitespace-only or a
                    non-string is a 400.
                machine:
                  type: string
                  pattern: "^[A-Za-z0-9._:-]{1,200}$"
                  description: >-
                    Optional. The caller-claimed machine id (the Relaycast node id
                    claimed through POST /api/v1/fleet/nodes/claim); treated only as a
                    claim. Malformed (including empty or non-string) is a 400.
      responses:
        "200":
          description: Introspection result (always 200 for an authenticated, well-formed request)
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    additionalProperties: false
                    required: [active, sub, email, principal_type, agent_name, machine_id, org, workspace, scopes, aud, iat, exp, token_id]
                    properties:
                      active: { const: true }
                      sub: { type: string, description: relaycontrol user id }
                      email: { type: string }
                      principal_type: { const: desktop-user }
                      agent_name: { type: "null" }
                      machine_id:
                        type: [string, "null"]
                        description: The verified machine id when `machine` was supplied; null when it was absent
                      org: { type: string, description: Organization id from the token session }
                      workspace: { type: string, description: "Workspace id from the token session; authoritative for the caller when the request omitted `workspace`" }
                      scopes:
                        type: array
                        items: { type: string }
                      aud: { type: string, description: The configured audience that matched }
                      iat: { type: integer }
                      exp: { type: integer }
                      token_id: { type: string, pattern: "^[0-9a-f]{32}$" }
                  - type: object
                    additionalProperties: false
                    required: [active, sub, email, principal_type, agent_name, machine_id, org, workspace, scopes, aud, iat, exp, token_id]
                    description: A relayfile-agent workspace API token.
                    properties:
                      active: { const: true }
                      sub: { type: string, format: uuid, description: The workspace API token id }
                      email: { type: "null" }
                      principal_type: { const: agent }
                      agent_name: { type: string, pattern: "^[A-Za-z0-9._:-]{1,200}$" }
                      machine_id: { type: "null" }
                      org: { type: string }
                      workspace: { type: string, description: "The token's workspace; authoritative when the request omitted `workspace`" }
                      scopes:
                        type: array
                        items: { enum: ["fs:read", "fs:write", "sync:read", "sync:trigger"] }
                      aud: { type: string, description: The token's stored (normalized) audience }
                      iat: { type: integer, description: Mint time }
                      exp: { type: integer, description: "The token's expiry, or now + 3600 (recomputed per call) when it has none" }
                      token_id: { type: string, format: uuid }
                  - type: object
                    additionalProperties: false
                    required: [active, sub, email, principal_type, agent_name, machine_id, org, workspace, scopes, aud, iat, exp, token_id]
                    description: An acquisition-operator workspace API token (an operator service).
                    properties:
                      active: { const: true }
                      sub: { type: string, format: uuid, description: The workspace API token id }
                      email: { type: "null" }
                      principal_type: { const: service }
                      agent_name: { type: "null" }
                      machine_id: { type: "null" }
                      org: { type: string }
                      workspace: { type: string, description: "The token's workspace; authoritative when the request omitted `workspace`" }
                      scopes:
                        type: array
                        items: { const: "acquisition:operate" }
                      aud: { type: string, description: The token's stored (normalized) audience }
                      iat: { type: integer, description: Mint time }
                      exp: { type: integer, description: "The token's expiry, or now + 3600 (recomputed per call) when it has none" }
                      token_id: { type: string, format: uuid }
                  - type: object
                    additionalProperties: false
                    required: [active, reason]
                    properties:
                      active: { const: false }
                      reason: { enum: [expired, revoked, unknown, wrong-kind, audience, workspace, machine_not_owned, machine_unclaimed, machine_workspace_mismatch] }
              examples:
                service:
                  summary: An active acquisition-operator token
                  value:
                    active: true
                    sub: 3f2b8c1e-5d4a-4e7b-9c10-2a6f8e9d0b11
                    email: null
                    principal_type: service
                    agent_name: null
                    machine_id: null
                    org: 7a1c2d3e-4f50-4617-8a9b-0c1d2e3f4a5b
                    workspace: 9b8a7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d
                    scopes: ["acquisition:operate"]
                    aud: https://history.example.com
                    iat: 1794268800
                    exp: 1802044800
                    token_id: 3f2b8c1e-5d4a-4e7b-9c10-2a6f8e9d0b11
        "400": { description: "invalid_request: body is not a JSON object with string token and aud (and, if present and not null, a non-empty string workspace; if present, a well-formed string machine), or exceeds 16 KiB" }
        "401": { description: "unauthorized: missing or wrong introspection secret" }
        "404": { description: Introspection is disabled (RELAYCONTROL_INTROSPECT_SECRET unset) }
  /internal/v1/workspaces/{workspaceId}/environment:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: internalWorkspaceEnvironment
      security:
        - serviceAuth: []
      description: |
        Runtime consumers only (flows worker, run executor). Returns decrypted
        deliverable variables and the workspace's selected coding-agent
        credentials (ANTHROPIC_API_KEY, CLAUDE_CODE_OAUTH_TOKEN, OPENAI_API_KEY,
        OPENROUTER_API_KEY, XAI_API_KEY, GEMINI_API_KEY). Launcher-owned names (RELAY_*, RELAYFILE_*, ...)
        are skipped. With includeIntegrations=1 (also needs
        runtime:integrations:read) adds WORKFORCE_INTEGRATION_<PROVIDER>_TOKEN
        and non-secret config as WORKFORCE_INTEGRATION_<PROVIDER>_<FIELD>.
        Every read is audited. Never accepts user sessions.
      parameters:
        - { name: includeIntegrations, in: query, schema: { enum: ["1", "true"] } }
      responses:
        "200":
          description: Environment
          content:
            application/json:
              schema:
                type: object
                properties:
                  workspaceId: { type: string }
                  env:
                    type: object
                    additionalProperties: { type: string }
                  secretEnvNames:
                    type: array
                    items: { type: string }
                    description: Names to redact from run logs (hosted RELAY_SECRET_ENV_NAMES).
                  skipped:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        reason: { enum: [reserved, undecryptable] }
                  integrationErrors:
                    type: array
                    items:
                      type: object
                      properties:
                        provider: { type: string }
                        error: { type: string }
        "401": { description: Service credential required }
        "403": { description: insufficient_scope }
        "404": { description: workspace_not_found }
  /internal/v1/workspaces/{workspaceId}/integrations:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: internalListIntegrations
      security:
        - serviceAuth: []
