    DesktopFeedManifest:
      x-status: proposed
      type: object
      additionalProperties: false
      required:
      - schema
      - profile
      - channel
      - version
      - published_at
      - notes
      - download_hosts
      - assets
      properties:
        schema:
          description: Document schema. A client refuses a schema it does not know.
          const: 1
        profile:
          description: Opaque profile id. Must equal the build's compiled id.
          type: string
          pattern: ^[a-z0-9]{1,32}$
        channel:
          description: Must equal the channel the client asked for.
          enum:
          - stable
          - beta
        version:
          description: YYYY.M.N on stable, YYYY.M.N-beta.N on beta.
          type: string
          pattern: ^[0-9]{4}\.(?:[1-9]|1[0-2])\.(?:0|[1-9][0-9]*)(?:-beta\.(?:0|[1-9][0-9]*))?$
        published_at:
          description: RFC 3339 UTC, whole seconds, set by the signing Cloud at publish.
          type: string
          format: date-time
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$
        notes:
          description: Markdown release notes from release-notes.py.
          type: string
          maxLength: 65536
        download_hosts:
          description: The only hosts a signed download URL may point at (DNS names, lower case, no port, no IP literal). Empty means streamed downloads from the site only.
          type: array
          maxItems: 8
          uniqueItems: true
          items:
            type: string
            maxLength: 253
            pattern: ^(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z](?:[a-z0-9-]{0,61}[a-z0-9])?$
        assets:
          type: array
          minItems: 1
          maxItems: 64
          uniqueItems: true
          items:
            $ref: '#/components/schemas/DesktopFeedAsset'
      allOf:
      - if:
          properties:
            channel:
              const: beta
          required:
          - channel
        then:
          properties:
            version:
              type: string
              pattern: -beta\.(?:0|[1-9][0-9]*)$
        else:
          properties:
            version:
              type: string
              not:
                type: string
                pattern: -beta\.
      description: The signed document; mirrors docs/specs/desktop-feed-manifest.schema.json (kept identical by test/desktop-feed-contract.test.ts).
    DesktopFeedAsset:
      x-status: proposed
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - platform
      - arch
      - kind
      - size
      - sha256
      properties:
        id:
          description: Opaque, assigned by the signing Cloud at upload; used by the download endpoints. Looked up only within the requesting profile.
          type: string
          pattern: ^a_[0-9A-Za-z]{1,64}$
        name:
          description: 'Today''s asset name, one path segment: dot-separated runs of [A-Za-z0-9_+-], so no ''/'', no leading dot and no ''..''. The storage key is always profiles/<profile>/releases/<version>/<name>.'
          type: string
          maxLength: 255
          pattern: ^[A-Za-z0-9][A-Za-z0-9_+-]*(?:\.[A-Za-z0-9_+-]+)*$
        platform:
          enum:
          - macOS
          - Linux
          - Windows
        arch:
          enum:
          - arm64
          - x64
        os_floor:
          description: macOS major floor; absent on the unfloored updater-bridge name and on every non-macOS asset.
          type: integer
          minimum: 10
          maximum: 99
        kind:
          enum:
          - image
          - tarball
          - zip
          - deb
          - setup
          - probe
          - install-script
        size:
          description: Bytes. A download larger than this is cut off.
          type: integer
          minimum: 1
          maximum: 9007199254740991
        sha256:
          description: Lower-case hex, 64 characters.
          type: string
          pattern: ^[0-9a-f]{64}$
      dependentSchemas:
        os_floor:
          properties:
            platform:
              const: macOS
    DesktopFeedEnvelope:
      x-status: proposed
      type: object
      additionalProperties: false
      required:
      - manifest
      - signature
      - key_id
      properties:
        manifest:
          $ref: '#/components/schemas/DesktopFeedManifest'
        signature:
          description: Ed25519 signature, 64 bytes, base64url without padding (86 characters; the last one carries 2 data bits).
          type: string
          pattern: ^[A-Za-z0-9_-]{85}[AQgw]$
        key_id:
          description: fk_<profile>_<label>. Selects the public key; a build carries one key and refuses any other key_id. The <profile> part must equal manifest.profile.
          type: string
          pattern: ^fk_[a-z0-9]{1,32}_[a-z0-9]{1,16}$
      description: Envelope served by the feed; mirrors docs/specs/desktop-feed-envelope.schema.json. A received envelope whose JSON text has a duplicate member name at any depth (compared after escape decoding), a lone surrogate, or anything outside RFC 8259 (including a leading BOM) is rejected before canonicalising or verifying (RFC 8785 section 3.1 requires I-JSON, RFC 7493).
    DesktopFeedErrorCode:
      x-status: proposed
      description: |
        Every `error` code a Desktop feed endpoint may return. Status: proposed,
        Cloud team decides, not yet confirmed. `not_entitled`,
        `no_object_storage` and the 401/403/404/429 split come from the source
        design; the other names are proposals.
      type: string
      enum:
        - invalid_request
        - profile_header_required
        - mixed_credentials
        - unauthenticated
        - token_expired
        - token_revoked
        - not_entitled
        - wrong_credential
        - csrf_rejected
        - no_release
        - draft_not_found
        - install_token_not_found
        - version_exists
        - not_a_draft
        - asset_conflict
        - invalid_release
        - expected_assets_required
        - invalid_asset
        - asset_not_declared
        - asset_mismatch
        - assets_incomplete
        - quota_exceeded
        - manifest_too_large
        - manifest_invalid
        - profile_mismatch
        - key_id_unknown
        - signature_invalid
        - range_not_satisfiable
        - rate_limited
        - no_object_storage
        - signer_unavailable
    DesktopFeedError:
      x-status: proposed
      description: |
        Error body, the same `{error, message}` shape every relaycontrol route
        returns. `message` is human text and never names another profile,
        workspace or asset. Codes with extra fields use the dedicated schemas
        (DesktopFeedAssetsIncomplete, DesktopFeedQuotaExceeded,
        DesktopFeedManifestTooLarge, DesktopFeedRateLimitedError).
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          allOf:
            - $ref: "#/components/schemas/DesktopFeedErrorCode"
            - not: { enum: [assets_incomplete, quota_exceeded, manifest_too_large, rate_limited] }
        message: { type: string, maxLength: 500 }
    DesktopFeedAssetsIncomplete:
      x-status: proposed
      type: object
      additionalProperties: false
      required: [error, missing, mismatched]
      properties:
        error: { const: assets_incomplete }
        message: { type: string, maxLength: 500 }
        missing:
          description: Declared names with no upload.
          type: array
          items: { type: string }
        mismatched:
          description: Declared names whose stored bytes no longer match the declared size or sha256.
          type: array
          items: { type: string }
    DesktopFeedQuotaExceeded:
      x-status: proposed
      description: |
        Refusal at draft creation, import or publish when the profile's usage
        after the beta pruning this release would cause exceeds its quota.
        Stable releases are never pruned to make room; an admin raises the
        quota or deletes releases explicitly.
      type: object
      additionalProperties: false
      required: [error, quota_bytes, used_bytes, required_bytes]
      properties:
        error: { const: quota_exceeded }
        message: { type: string, maxLength: 500 }
        quota_bytes: { type: integer, minimum: 0 }
        used_bytes: { type: integer, minimum: 0, description: "Retained published bytes plus every open draft's declared bytes, after the beta pruning this release would cause." }
        required_bytes: { type: integer, minimum: 1, description: Declared bytes of this release. }
    DesktopFeedManifestTooLarge:
      x-status: proposed
      description: |
        Refusal at publish of a hosted draft when the RFC 8785 canonical bytes
        of the manifest exceed the signer's declared limit (for example 4096
        bytes for AWS KMS Sign with MessageType RAW). Checked after the quota
        check and before signing; nothing is signed or deleted and the draft
        stays a draft. Shorten `notes`, split assets across releases, or use a
        signer without the limit. Import never signs and never answers this.
      type: object
      additionalProperties: false
      required: [error, canonical_bytes, max_canonical_bytes]
      properties:
        error: { const: manifest_too_large }
        message: { type: string, maxLength: 500 }
        canonical_bytes: { type: integer, minimum: 1, description: Length of the RFC 8785 canonical UTF-8 bytes of the manifest that would have been signed. }
        max_canonical_bytes: { type: integer, minimum: 1, description: The signer's declared limit. }
    DesktopFeedRateLimitedError:
      x-status: proposed
      type: object
      additionalProperties: false
      required: [error, retry_after_seconds]
      properties:
        error: { const: rate_limited }
        message: { type: string, maxLength: 500 }
        retry_after_seconds: { type: integer, minimum: 1 }
    DesktopFeedReleaseList:
      x-status: proposed
      type: object
      additionalProperties: false
      required: [releases, next_page]
      properties:
        releases:
          type: array
          description: Envelopes, newest first, exactly as stored. Drafts are never included.
          items: { $ref: "#/components/schemas/DesktopFeedEnvelope" }
        next_page: { type: [integer, "null"], minimum: 2 }
    DesktopFeedPublisherVersionList:
      x-status: proposed
      description: The only document a publisher token can read.
      type: object
      additionalProperties: false
      required: [versions, next_page, limits]
      properties:
        versions:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [version, channel, state, origin, published_at, current]
            properties:
              version: { type: string }
              channel: { enum: [stable, beta] }
              state: { enum: [draft, published] }
              origin: { enum: [publish, import] }
              published_at: { type: [string, "null"], format: date-time }
              current: { type: boolean, description: The channel's current release (what the manifest endpoint serves). }
        next_page: { type: [integer, "null"], minimum: 2 }
        limits: { $ref: "#/components/schemas/DesktopFeedLimits" }
    DesktopFeedLimits:
      x-status: proposed
      description: |
        Per-profile quota and retention, plus the signer's canonical byte
        limit. Status: proposed (open question 6),
        Cloud team decides, not yet confirmed. Proposed defaults:
        every stable retained, the newest 10 betas retained, 20 GB
        (20000000000 bytes) per profile.
      type: object
      additionalProperties: false
      required: [quota_bytes, used_bytes, retention, max_canonical_bytes]
      properties:
        quota_bytes: { type: integer, minimum: 0 }
        used_bytes: { type: integer, minimum: 0 }
        max_canonical_bytes:
          type: [integer, "null"]
          minimum: 1
          description: |
            The configured signer's declared limit on the RFC 8785 canonical
            bytes of a manifest (4096 for awskms, which signs RAW messages of
            at most 4096 bytes), or null when the signer declares none. A
            hosted publish whose canonical manifest is longer answers 422
            `manifest_too_large` before signing; a publish job can measure
            ahead. Import never signs and is not limited by it.
        retention:
          type: object
          additionalProperties: false
          required: [stable, beta_keep]
          properties:
            stable: { const: all, description: Stable releases are never deleted automatically. }
            beta_keep: { type: integer, minimum: 1, description: "Published betas kept, by publish order; older ones are deleted only when a beta is published." }
    DesktopFeedExpectedAsset:
      x-status: proposed
      description: |
        One declared asset of a draft: the manifest asset without `id` (the id
        is assigned at upload). Same field rules as DesktopFeedAsset.
      type: object
      additionalProperties: false
      required: [name, platform, arch, kind, size, sha256]
      properties:
        name: { type: string, maxLength: 255, pattern: "^[A-Za-z0-9][A-Za-z0-9_+-]*(?:\\.[A-Za-z0-9_+-]+)*$" }
        platform: { enum: [macOS, Linux, Windows] }
        arch: { enum: [arm64, x64] }
        os_floor: { type: integer, minimum: 10, maximum: 99 }
        kind: { enum: [image, tarball, zip, deb, setup, probe, install-script] }
        size: { type: integer, minimum: 1, maximum: 9007199254740991 }
        sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
      dependentSchemas: { os_floor: { properties: { platform: { const: macOS } } } }
    DesktopFeedDraftCreate:
      x-status: proposed
      type: object
      additionalProperties: false
      required: [version, channel, notes, expected_assets]
      properties:
        version: { type: string, pattern: "^[0-9]{4}\\.(?:[1-9]|1[0-2])\\.(?:0|[1-9][0-9]*)(?:-beta\\.(?:0|[1-9][0-9]*))?$" }
        channel: { enum: [stable, beta] }
        notes: { type: string, maxLength: 65536 }
        expected_assets:
          description: The complete asset set of the release. Required and non-empty; names unique.
          type: array
          minItems: 1
          maxItems: 64
          items: { $ref: "#/components/schemas/DesktopFeedExpectedAsset" }
      allOf:
        - if: { properties: { channel: { const: beta } }, required: [channel] }
          then: { properties: { version: { type: string, pattern: "-beta\\.(?:0|[1-9][0-9]*)$" } } }
          else: { properties: { version: { type: string, not: { type: string, pattern: "-beta\\." } } } }
    DesktopFeedDraft:
      x-status: proposed
      type: object
      additionalProperties: false
      required: [version, channel, state, origin, notes, created_at, expected_assets]
      properties:
        version: { type: string }
        channel: { enum: [stable, beta] }
        state: { const: draft }
        origin: { enum: [publish, import], description: "`import` drafts carry a pre-signed envelope and are stored verbatim at publish." }
        notes: { type: string }
        created_at: { type: string, format: date-time }
        expected_assets:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, platform, arch, kind, size, sha256, uploaded, id]
            properties:
              name: { type: string }
              platform: { enum: [macOS, Linux, Windows] }
              arch: { enum: [arm64, x64] }
              os_floor: { type: integer }
              kind: { enum: [image, tarball, zip, deb, setup, probe, install-script] }
              size: { type: integer, minimum: 1 }
              sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
              uploaded: { type: boolean }
              id: { type: [string, "null"], description: "Assigned at upload; for an import draft, the signed manifest's id." }
    DesktopFeedImport:
      x-status: proposed
      type: object
      additionalProperties: false
      required: [envelope]
      properties:
        envelope: { $ref: "#/components/schemas/DesktopFeedEnvelope" }
    DesktopFeedPublish:
      x-status: proposed
      type: object
      additionalProperties: false
      properties:
        latest:
          type: boolean
          default: false
          description: |
            Stable: true makes this release the channel's current one (the
            source design's `{latest: true}`). Beta: ignored; the current beta
            is the most recently published beta.
    DesktopFeedUploaded:
      x-status: proposed
      type: object
      additionalProperties: false
      required: [id, name, size, sha256]
      properties:
        id: { type: string, pattern: "^a_[0-9A-Za-z]{1,64}$" }
        name: { type: string }
        size: { type: integer, minimum: 1 }
        sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
    DesktopFeedDownloadUrl:
      x-status: proposed
      description: |
        A signed GET URL for one object, valid 5 minutes. The client refuses
        it unless it is https and its host is in the signed manifest's
        `download_hosts` (or is the site itself), and follows no redirect.
      type: object
      additionalProperties: false
      required: [url, expires_at]
      properties:
        url: { type: string, format: uri, pattern: "^https://" }
        expires_at: { type: string, format: date-time }
    DesktopFeedInstallTokenCreate:
      x-status: proposed
      type: object
      additionalProperties: false
      properties:
        label: { type: string, maxLength: 128 }
    DesktopFeedInstallTokenIssued:
      x-status: proposed
      type: object
      additionalProperties: false
      required: [id, token, profile, workspace_id, created_at, expires_at, command]
      properties:
        id: { type: string, format: uuid }
        token:
          type: string
          description: Shown once; proposed prefix `sh_dfi_` (opaqueToken in src/crypto.ts).
          pattern: "^sh_dfi_[A-Za-z0-9_-]{43}$"
        label: { type: [string, "null"] }
        profile: { type: string, pattern: "^[a-z0-9]{1,32}$" }
        workspace_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time, description: created_at plus 1 hour }
        command: { type: string, description: "The command the page shows: `AGENT_RELAY_INSTALL_TOKEN=<token> bash install.sh`." }
    DesktopFeedInstallTokenSummary:
      x-status: proposed
      type: object
      additionalProperties: false
      required: [id, label, token_prefix, profile, workspace_id, created_at, expires_at, revoked_at, last_used_at, status]
      properties:
        id: { type: string, format: uuid }
        label: { type: [string, "null"] }
        token_prefix: { type: string, description: The first 11 characters only. }
        profile: { type: string, pattern: "^[a-z0-9]{1,32}$" }
        workspace_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        revoked_at: { type: [string, "null"], format: date-time }
        last_used_at: { type: [string, "null"], format: date-time }
        status: { enum: [active, expired, revoked] }
  responses:
    FactoryError:
      description: Factory error with a stable code
      content:
        application/json:
          schema: { $ref: "#/components/schemas/FactoryError" }
    CodingAgentStored:
      description: Stored credential (201 created, 200 existing or replaced)
      content:
        application/json:
          schema:
            type: object
            properties:
              providerCredentialId: { type: string }
              id: { type: string }
              agent: { $ref: "#/components/schemas/CodingAgentCredential" }
    DesktopFeedBadRequest:
      description: profile_header_required, mixed_credentials (more than one credential; refused, never merged), or invalid_request
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/DesktopFeedError"
              - properties: { error: { enum: [profile_header_required, mixed_credentials, invalid_request] } }
    DesktopFeedUnauthorized:
      description: No credential, or a bearer that is unknown or expired (unauthenticated); an install token past its hour (token_expired) or revoked (token_revoked)
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/DesktopFeedError"
              - properties: { error: { enum: [unauthenticated, token_expired, token_revoked] } }
    DesktopFeedReadForbidden:
      description: |
        not_entitled: the profile is not bound to the caller's signed-in
        workspace, the profile id is unknown, or the asset id is not in the
        profile's published releases (never 404 for any of these).
        wrong_credential: the credential kind is not accepted here.
        csrf_rejected: a cookie request failed the browser-origin check.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/DesktopFeedError"
              - properties: { error: { enum: [not_entitled, wrong_credential, csrf_rejected] } }
    DesktopFeedPublisherForbidden:
      description: |
        not_entitled: the header names a profile other than the publisher
        token's, or an unknown one. wrong_credential: a workspace bearer,
        install token or browser session on a publisher endpoint.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/DesktopFeedError"
              - properties: { error: { enum: [not_entitled, wrong_credential] } }
    DesktopFeedNoRelease:
      description: no_release. The profile is entitled and known, but this channel has no published release yet. Never used for an unknown or unbound profile.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/DesktopFeedError"
              - properties: { error: { enum: [no_release] } }
    DesktopFeedRateLimited:
      description: rate_limited, with Retry-After in seconds. Proposed per-profile limits are in docs/desktop-feed.md.
      headers:
        Retry-After:
          required: true
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/DesktopFeedRateLimitedError" }
