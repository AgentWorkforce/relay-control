  # --- Desktop feed (draft contract; docs/desktop-feed.md). Status: proposed, Cloud team decides,
  # not yet confirmed. Nothing below is implemented by this server.
  /api/v1/desktop/feed/manifest:
    get:
      tags: [Desktop feed (draft contract)]
      operationId: getDesktopFeedManifest
      x-status: proposed
      x-desktop-feed-role: read
      x-desktop-feed-credentials: [workspaceBearer, installToken, browserSession]
      summary: Envelope of the current release of the profile's channel.
      description: |
        Status: proposed, Cloud team decides, not yet confirmed.
        Accepts a workspace bearer (the desktop-core session), an install token,
        or the browser session cookie (on the `/cloud` mount only). A publisher
        token is refused with 403 `wrong_credential`; two credentials in one
        request are refused with 400 `mixed_credentials`, never merged.
        The envelope is returned byte-for-byte as stored at publish or import.
        A profile not bound to the caller's signed-in workspace and a profile id
        the server does not know both answer 403 `not_entitled`; 404 is only for
        a channel of an entitled profile with no release yet.
      security:
        - bearerAuth: []
        - installToken: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/DesktopFeedProfile"
        - $ref: "#/components/parameters/DesktopFeedChannel"
      responses:
        "200":
          description: Envelope of the channel's current release (Cache-Control no-store)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DesktopFeedEnvelope" }
        "400": { $ref: "#/components/responses/DesktopFeedBadRequest" }
        "401": { $ref: "#/components/responses/DesktopFeedUnauthorized" }
        "403": { $ref: "#/components/responses/DesktopFeedReadForbidden" }
        "404": { $ref: "#/components/responses/DesktopFeedNoRelease" }
        "429": { $ref: "#/components/responses/DesktopFeedRateLimited" }
  /api/v1/desktop/feed/releases:
    get:
      tags: [Desktop feed (draft contract)]
      operationId: listDesktopFeedReleases
      x-status: proposed
      x-desktop-feed-role: read
      x-desktop-feed-credentials: [workspaceBearer, installToken, browserSession, publisherToken]
      summary: Published releases newest first (read), or the version listing with drafts (publisher).
      description: |
        Status: proposed, Cloud team decides, not yet confirmed.
        Two callers, two shapes, chosen by the credential and `include_drafts`:
        - Read (workspace bearer, install token, browser session on `/cloud`):
          `include_drafts` must be absent or false. Returns
          `DesktopFeedReleaseList`, envelopes newest first, drafts never
          included. 404 `no_release` when the channel of an entitled profile
          has no published release.
        - Publisher token: `include_drafts=true` is required (otherwise 403
          `wrong_credential`, since reading envelopes is a read). Returns
          `DesktopFeedPublisherVersionList`: versions and states only, no
          envelopes, no notes, no assets, plus the profile's quota and
          retention (`limits`). This is the only thing a publisher token can
          read. Never 404: an empty profile returns an empty list.
        A read credential with `include_drafts=true` is 403 `wrong_credential`.
        Two credentials in one request are refused with 400 `mixed_credentials`.
      security:
        - bearerAuth: []
        - installToken: []
        - cookieAuth: []
        - publisherToken: []
      parameters:
        - $ref: "#/components/parameters/DesktopFeedProfile"
        - name: channel
          in: query
          required: false
          description: Read callers must pass it; the publisher may omit it to list both channels.
          schema: { type: string, enum: [stable, beta] }
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: include_drafts
          in: query
          required: false
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Release listing (read) or version listing (publisher)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/DesktopFeedReleaseList"
                  - $ref: "#/components/schemas/DesktopFeedPublisherVersionList"
        "400": { $ref: "#/components/responses/DesktopFeedBadRequest" }
        "401": { $ref: "#/components/responses/DesktopFeedUnauthorized" }
        "403": { $ref: "#/components/responses/DesktopFeedReadForbidden" }
        "404": { $ref: "#/components/responses/DesktopFeedNoRelease" }
        "429": { $ref: "#/components/responses/DesktopFeedRateLimited" }
    post:
      tags: [Desktop feed (draft contract)]
      operationId: createDesktopFeedDraft
      x-status: proposed
      x-desktop-feed-role: publisher
      x-desktop-feed-credentials: [publisherToken]
      summary: Create a draft release that declares its complete asset set.
      description: |
        Status: proposed, Cloud team decides, not yet confirmed.
        Publisher token only. A workspace bearer, install token or browser
        session is 403 `wrong_credential`; mixed credentials are 400.
        Resolves an omission in the source design: the draft declares every
        asset up front in `expected_assets` (required, non-empty). Uploads must
        match a declared entry by name, size and sha256, and publish signs only
        after every declared asset is present. The asset set is never inferred
        at publish time. The draft is invisible to the read API.
        Retry: posting the same version with an identical body while that
        draft is still open returns 200 with the existing draft; any other
        body for an existing version is 409 `version_exists`.
        Quota: the declared total is reserved now; if the profile's projected
        usage after this release's beta pruning would exceed its quota, the
        request is refused with 422 `quota_exceeded` before any byte is sent.
      security:
        - publisherToken: []
      parameters:
        - $ref: "#/components/parameters/DesktopFeedProfile"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DesktopFeedDraftCreate" }
      responses:
        "201":
          description: Draft created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DesktopFeedDraft" }
        "200":
          description: Identical draft already open (retry)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DesktopFeedDraft" }
        "400": { $ref: "#/components/responses/DesktopFeedBadRequest" }
        "401": { $ref: "#/components/responses/DesktopFeedUnauthorized" }
        "403": { $ref: "#/components/responses/DesktopFeedPublisherForbidden" }
        "409":
          description: version_exists (published, or a draft with a different body)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DesktopFeedError"
                  - properties: { error: { enum: [version_exists] } }
        "422":
          description: |
            invalid_release (version pattern, channel, or the beta.N rule),
            expected_assets_required (missing or empty), invalid_asset (an
            entry fails the asset rules, or names or platform/arch/kind/os_floor
            tuples repeat), or quota_exceeded.
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: "#/components/schemas/DesktopFeedError"
                      - properties: { error: { enum: [invalid_release, expected_assets_required, invalid_asset] } }
                  - $ref: "#/components/schemas/DesktopFeedQuotaExceeded"
        "429": { $ref: "#/components/responses/DesktopFeedRateLimited" }
  /api/v1/desktop/feed/releases/import:
    post:
      tags: [Desktop feed (draft contract)]
      operationId: importDesktopFeedRelease
      x-status: proposed
      x-desktop-feed-role: publisher
      x-desktop-feed-credentials: [publisherToken]
      summary: Open an import draft from a pre-signed envelope (on-prem path (a); also the store step of (b) and (c)).
      description: |
        Status: proposed, Cloud team decides, not yet confirmed. The
        endpoint itself is decided in the source design (open question 5:
        "verified against the profile's public key before it is stored"); its
        two-step shape here is a proposal, and whether it ships before or after
        path (b) is the Cloud team's call.
        Publisher token only (issued by the customer's own deployment). The
        server VERIFIES and never signs: the manifest validates against
        `DesktopFeedManifest`; `manifest.profile` equals the header and the
        token's profile; `key_id` is one of the profile's registered public
        keys; the Ed25519 signature verifies over the RFC 8785 bytes of the
        `manifest` as received. It then opens an import draft whose
        `expected_assets` are exactly `manifest.assets` (ids kept). Assets are
        uploaded with the same PUT as any draft and
        `POST /releases/{version}/publish` stores the envelope verbatim
        (byte-identical; `published_at` stays the signer's). This deployment
        holds no private key.
      security:
        - publisherToken: []
      parameters:
        - $ref: "#/components/parameters/DesktopFeedProfile"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DesktopFeedImport" }
      responses:
        "201":
          description: Import draft created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DesktopFeedDraft" }
        "400": { $ref: "#/components/responses/DesktopFeedBadRequest" }
        "401": { $ref: "#/components/responses/DesktopFeedUnauthorized" }
        "403": { $ref: "#/components/responses/DesktopFeedPublisherForbidden" }
        "409":
          description: version_exists
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DesktopFeedError"
                  - properties: { error: { enum: [version_exists] } }
        "422":
          description: manifest_invalid, profile_mismatch, key_id_unknown, signature_invalid, or quota_exceeded. manifest_invalid includes a body whose JSON text has a duplicate member name at any depth (compared after escape decoding), a lone surrogate, or anything outside RFC 8259 (including a leading BOM); it is rejected before canonicalising or verifying (RFC 8785 section 3.1 requires I-JSON, RFC 7493).
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: "#/components/schemas/DesktopFeedError"
                      - properties: { error: { enum: [manifest_invalid, profile_mismatch, key_id_unknown, signature_invalid] } }
                  - $ref: "#/components/schemas/DesktopFeedQuotaExceeded"
        "429": { $ref: "#/components/responses/DesktopFeedRateLimited" }
  /api/v1/desktop/feed/releases/{version}/assets/{name}:
    put:
      tags: [Desktop feed (draft contract)]
      operationId: uploadDesktopFeedAsset
      x-status: proposed
      x-desktop-feed-role: publisher
      x-desktop-feed-credentials: [publisherToken]
      summary: Upload one declared asset's bytes to a draft.
      description: |
        Status: proposed, Cloud team decides, not yet confirmed.
        Publisher token only; workspace bearer, install token or browser
        session is 403 `wrong_credential`. Checks, in order:
        1. The release is an open draft (404 `draft_not_found`; 409
           `not_a_draft` once published).
        2. `name` is declared in the draft's `expected_assets` (422
           `asset_not_declared`).
        3. If `name` is already uploaded: identical sha256 and size answer 200
           with the existing id; anything else is 409 `asset_conflict`.
        4. `Content-Length` and `X-Content-SHA256` equal the declared size and
           sha256 (422 `asset_mismatch`, refused before the body is read).
        5. The received byte count and computed sha256 equal the declaration
           (422 `asset_mismatch`; nothing is kept).
        A failed upload leaves the draft open, unpublished and invisible to
        the read API.
      security:
        - publisherToken: []
      parameters:
        - $ref: "#/components/parameters/DesktopFeedProfile"
        - $ref: "#/components/parameters/DesktopFeedVersion"
        - $ref: "#/components/parameters/DesktopFeedAssetName"
        - name: X-Content-SHA256
          in: header
          required: true
          schema: { type: string, pattern: "^[0-9a-f]{64}$" }
        - name: Content-Length
          in: header
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, contentMediaType: application/octet-stream }
      responses:
        "201":
          description: Stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DesktopFeedUploaded" }
        "200":
          description: Same bytes already stored under this name (retry)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DesktopFeedUploaded" }
        "400": { $ref: "#/components/responses/DesktopFeedBadRequest" }
        "401": { $ref: "#/components/responses/DesktopFeedUnauthorized" }
        "403": { $ref: "#/components/responses/DesktopFeedPublisherForbidden" }
        "404":
          description: draft_not_found (no draft of this version on the token's profile)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DesktopFeedError"
                  - properties: { error: { enum: [draft_not_found] } }
        "409":
          description: asset_conflict (name exists with other bytes) or not_a_draft
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DesktopFeedError"
                  - properties: { error: { enum: [asset_conflict, not_a_draft] } }
        "422":
          description: asset_not_declared, or asset_mismatch (size or sha256 differs from the declaration)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DesktopFeedError"
                  - properties: { error: { enum: [asset_not_declared, asset_mismatch] } }
        "429": { $ref: "#/components/responses/DesktopFeedRateLimited" }
  /api/v1/desktop/feed/releases/{version}/publish:
    post:
      tags: [Desktop feed (draft contract)]
      operationId: publishDesktopFeedRelease
      x-status: proposed
      x-desktop-feed-role: publisher
      x-desktop-feed-credentials: [publisherToken]
      x-proposed-default: "gcpkms hosted, awskms non-production; see docs/desktop-feed.md Proposed defaults"
      x-signer-provider:
        x-status: unresolved
        description: |
          Which provider holds the hosted feed's Ed25519 private keys is not
          decided (the source design says Cloud's KMS; the Cloud team has not
          confirmed a provider). A key held by this deployment's Postgres is
          not a fallback.
      summary: Verify the declared asset set, then sign (hosted draft) or store verbatim (import draft).
      description: |
        Status: proposed, Cloud team decides, not yet confirmed.
        Publisher token only. Steps, in order; any failure leaves the release
        a draft, unsigned and invisible to the read API:
        1. Open draft (404 `draft_not_found`, 409 `not_a_draft`).
        2. Every entry of `expected_assets` is uploaded with its full byte
           count and sha256; otherwise 422 `assets_incomplete` listing
           `missing` and `mismatched` names.
        3. Quota after this release's beta pruning (422 `quota_exceeded`).
        4. Hosted draft: build the manifest (`published_at` now, assets in
           declaration order) and canonicalise it with RFC 8785. If the
           signer declares a canonical byte limit (`max_canonical_bytes` in
           `DesktopFeedLimits`) and the canonical bytes exceed it, 422
           `manifest_too_large` with `canonical_bytes` and
           `max_canonical_bytes`; nothing is signed or deleted and the draft
           stays a draft. Import drafts skip this check (they never sign).
        5. Hosted draft: sign the canonical bytes with the profile's Ed25519
           key; 503 `signer_unavailable` if the signer cannot be reached.
           Import draft: re-verify and store the imported envelope verbatim;
           never sign.
        6. Store the envelope as the release's `manifest.json`, mark it
           published, move the channel's current release when `latest`, then
           prune betas by the retention rule.
        Signing happens here and only here, and only after steps 2 to 4 passed.
      security:
        - publisherToken: []
      parameters:
        - $ref: "#/components/parameters/DesktopFeedProfile"
        - $ref: "#/components/parameters/DesktopFeedVersion"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DesktopFeedPublish" }
      responses:
        "200":
          description: Published envelope
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DesktopFeedEnvelope" }
        "400": { $ref: "#/components/responses/DesktopFeedBadRequest" }
        "401": { $ref: "#/components/responses/DesktopFeedUnauthorized" }
        "403": { $ref: "#/components/responses/DesktopFeedPublisherForbidden" }
        "404":
          description: draft_not_found
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DesktopFeedError"
                  - properties: { error: { enum: [draft_not_found] } }
        "409":
          description: not_a_draft
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DesktopFeedError"
                  - properties: { error: { enum: [not_a_draft] } }
        "422":
          description: assets_incomplete, quota_exceeded, manifest_too_large (hosted draft whose canonical manifest exceeds the signer's declared byte limit; nothing signed), or signature_invalid (import draft whose stored envelope no longer verifies)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/DesktopFeedAssetsIncomplete"
                  - $ref: "#/components/schemas/DesktopFeedQuotaExceeded"
                  - $ref: "#/components/schemas/DesktopFeedManifestTooLarge"
                  - allOf:
                      - $ref: "#/components/schemas/DesktopFeedError"
                      - properties: { error: { enum: [signature_invalid] } }
        "429": { $ref: "#/components/responses/DesktopFeedRateLimited" }
        "503":
          description: signer_unavailable (hosted draft only); the draft stays a draft
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DesktopFeedError"
                  - properties: { error: { enum: [signer_unavailable] } }
  /api/v1/desktop/feed/assets/{assetId}/download-url:
    post:
      tags: [Desktop feed (draft contract)]
      operationId: issueDesktopFeedDownloadUrl
      x-status: proposed
      x-desktop-feed-role: read
      x-desktop-feed-credentials: [workspaceBearer, installToken, browserSession]
      summary: Short-lived signed GET URL for one published asset.
      description: |
        Status: proposed, Cloud team decides, not yet confirmed.
        Accepts a workspace bearer, an install token, or the browser session
        cookie on the `/cloud` mount (cookie requests also pass the existing
        browser-origin check, else 403 `csrf_rejected`). A publisher token is
        403 `wrong_credential`; mixed credentials are 400.
        The URL names one object, allows GET only, and expires 5 minutes after
        issue; its host is one of the signed manifest's `download_hosts`. It is
        checked only when a request starts. An asset id that is unknown, a
        draft's, or another profile's answers 403 `not_entitled`: ids are
        looked up only within the header's profile, so a caller cannot probe
        other profiles' assets. 501 `no_object_storage` when this deployment
        streams only (the manifest's `download_hosts` is empty, or the
        deployment's store host is not in it); the client then uses
        `GET /assets/{assetId}`.
      security:
        - bearerAuth: []
        - installToken: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/DesktopFeedProfile"
        - $ref: "#/components/parameters/DesktopFeedAssetId"
      responses:
        "200":
          description: Signed URL (Cache-Control no-store)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DesktopFeedDownloadUrl" }
        "400": { $ref: "#/components/responses/DesktopFeedBadRequest" }
        "401": { $ref: "#/components/responses/DesktopFeedUnauthorized" }
        "403": { $ref: "#/components/responses/DesktopFeedReadForbidden" }
        "429": { $ref: "#/components/responses/DesktopFeedRateLimited" }
        "501":
          description: no_object_storage; use the streamed GET
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DesktopFeedError"
                  - properties: { error: { enum: [no_object_storage] } }
  /api/v1/desktop/feed/assets/{assetId}:
    get:
      tags: [Desktop feed (draft contract)]
      operationId: streamDesktopFeedAsset
      x-status: proposed
      x-desktop-feed-role: read
      x-desktop-feed-credentials: [workspaceBearer, installToken, browserSession]
      x-desktop-feed-redirects: never
      summary: Stream one published asset from the site itself.
      description: |
        Status: proposed, Cloud team decides, not yet confirmed.
        Accepts a workspace bearer, an install token, or the browser session
        cookie on the `/cloud` mount. A publisher token is 403
        `wrong_credential`; mixed credentials are 400.
        Served by the site itself, never by a redirect: no 3xx is defined, and
        a client follows no redirect off the site. A single `Range: bytes=`
        range is honoured (206 with `Content-Range`); multiple ranges or an
        unsatisfiable range are 416. `ETag` is the quoted asset sha256, so a
        resumed download can send `If-Range`. Asset ids not in the header's
        profile's published releases are 403 `not_entitled`.
      security:
        - bearerAuth: []
        - installToken: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/DesktopFeedProfile"
        - $ref: "#/components/parameters/DesktopFeedAssetId"
        - name: Range
          in: header
          required: false
          schema: { type: string, pattern: "^bytes=[0-9]*-[0-9]*$" }
        - name: If-Range
          in: header
          required: false
          schema: { type: string }
      responses:
        "200":
          description: The whole asset
          headers:
            Content-Length: { schema: { type: integer } }
            Accept-Ranges: { schema: { const: bytes } }
            ETag: { schema: { type: string, pattern: "^\"[0-9a-f]{64}\"$" } }
          content:
            application/octet-stream:
              schema: { type: string, contentMediaType: application/octet-stream }
        "206":
          description: One byte range
          headers:
            Content-Range: { schema: { type: string, pattern: "^bytes [0-9]+-[0-9]+/[0-9]+$" } }
            Content-Length: { schema: { type: integer } }
            ETag: { schema: { type: string, pattern: "^\"[0-9a-f]{64}\"$" } }
          content:
            application/octet-stream:
              schema: { type: string, contentMediaType: application/octet-stream }
        "400": { $ref: "#/components/responses/DesktopFeedBadRequest" }
        "401": { $ref: "#/components/responses/DesktopFeedUnauthorized" }
        "403": { $ref: "#/components/responses/DesktopFeedReadForbidden" }
        "416":
          description: range_not_satisfiable (or more than one range); Content-Range is `bytes */<size>`
          headers:
            Content-Range: { schema: { type: string, pattern: "^bytes \\*/[0-9]+$" } }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DesktopFeedError"
                  - properties: { error: { enum: [range_not_satisfiable] } }
        "429": { $ref: "#/components/responses/DesktopFeedRateLimited" }
  /api/v1/desktop/feed/install-tokens:
    get:
      tags: [Desktop feed (draft contract)]
      operationId: listDesktopFeedInstallTokens
      x-status: proposed
      x-desktop-feed-role: install-token
      x-desktop-feed-credentials: [browserSession]
      summary: The caller's install tokens for the profile (never the token values).
      description: |
        Status: proposed, Cloud team decides, not yet confirmed.
        Browser session cookie on the `/cloud` mount only (the downloads page).
        A workspace bearer, install token or publisher token is 403
        `wrong_credential`; mixed credentials are 400. Lists the caller's own
        tokens for the header's profile in the session workspace.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/DesktopFeedProfile"
      responses:
        "200":
          description: Token summaries, newest first
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [tokens]
                properties:
                  tokens:
                    type: array
                    items: { $ref: "#/components/schemas/DesktopFeedInstallTokenSummary" }
        "400": { $ref: "#/components/responses/DesktopFeedBadRequest" }
        "401": { $ref: "#/components/responses/DesktopFeedUnauthorized" }
        "403": { $ref: "#/components/responses/DesktopFeedReadForbidden" }
        "429": { $ref: "#/components/responses/DesktopFeedRateLimited" }
    post:
      tags: [Desktop feed (draft contract)]
      operationId: createDesktopFeedInstallToken
      x-status: proposed
      x-desktop-feed-role: install-token
      x-desktop-feed-credentials: [browserSession]
      summary: Mint a 1-hour install token for headless installs.
      description: |
        Status: proposed, Cloud team decides, not yet confirmed.
        Browser session cookie on the `/cloud` mount only, with the existing
        browser-origin check (403 `csrf_rejected`). Any bearer, including a
        workspace bearer, is 403 `wrong_credential`; mixed credentials are 400.
        Scope: feed read for the header's profile through the session's
        workspace, which must be bound to it (else 403 `not_entitled`).
        Lifetime 1 hour, not renewable. The plaintext token is returned only in
        this response; the server keeps its SHA-256 hash (`hashSecret` in
        src/crypto.ts), as for `sh_wk_` workspace API tokens. The token is
        accepted by the four read endpoints only, and dies with the user: it
        stops working when the user is removed or disabled, leaves the
        workspace, or the workspace is unbound from the profile.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/DesktopFeedProfile"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DesktopFeedInstallTokenCreate" }
      responses:
        "201":
          description: Token issued once (Cache-Control no-store)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DesktopFeedInstallTokenIssued" }
        "400": { $ref: "#/components/responses/DesktopFeedBadRequest" }
        "401": { $ref: "#/components/responses/DesktopFeedUnauthorized" }
        "403": { $ref: "#/components/responses/DesktopFeedReadForbidden" }
        "429": { $ref: "#/components/responses/DesktopFeedRateLimited" }
  /api/v1/desktop/feed/install-tokens/{tokenId}:
    delete:
      tags: [Desktop feed (draft contract)]
      operationId: revokeDesktopFeedInstallToken
      x-status: proposed
      x-desktop-feed-role: install-token
      x-desktop-feed-credentials: [browserSession]
      summary: Revoke one of the caller's install tokens.
      description: |
        Status: proposed, Cloud team decides, not yet confirmed.
        Browser session cookie on the `/cloud` mount only, with the
        browser-origin check. Revocation takes effect on the next request made
        with the token (401 `token_revoked`); a signed URL already issued with
        it still expires within its 5 minutes.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/DesktopFeedProfile"
        - name: tokenId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Revoked (idempotent for an already revoked token)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DesktopFeedInstallTokenSummary" }
        "400": { $ref: "#/components/responses/DesktopFeedBadRequest" }
        "401": { $ref: "#/components/responses/DesktopFeedUnauthorized" }
        "403": { $ref: "#/components/responses/DesktopFeedReadForbidden" }
        "404":
          description: install_token_not_found (unknown, or not the caller's)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DesktopFeedError"
                  - properties: { error: { enum: [install_token_not_found] } }
        "429": { $ref: "#/components/responses/DesktopFeedRateLimited" }
  /api/v1/workspaces/{workspaceId}/factory/connection:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      tags: [factory]
      operationId: getFactoryConnection
      description: |
        Owner/admin with cli:auth; workspace API tokens and the internal token
        are refused (403 factory_workspace_token). 404 not_found when
        SELFHOST_FACTORY_ENABLED is off. The key is never returned.
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FactorySummary" }
        "403": { $ref: "#/components/responses/FactoryError" }
        "404": { $ref: "#/components/responses/FactoryError" }
    put:
      tags: [factory]
      operationId: putFactoryConnection
      description: |
        Connect or replace the workspace Factory key. The key is validated by
        listing computers; only an envelope and a key_hint are stored. Another
        admin may connect only when no other member has a live binding or a
        cleanup-pending binding of an active member (409
        factory_other_member_bindings). The owner's replacement re-verifies up
        to 8 bound sessions (409 factory_replace_limit above that).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key]
              properties:
                key: { type: string, minLength: 16, maxLength: 2048, writeOnly: true }
      responses:
        "200":
          description: Summary after connect
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FactorySummary" }
        "403": { $ref: "#/components/responses/FactoryError" }
        "404": { $ref: "#/components/responses/FactoryError" }
        "409": { $ref: "#/components/responses/FactoryError" }
        "422": { $ref: "#/components/responses/FactoryError" }
        "502": { $ref: "#/components/responses/FactoryError" }
        "503": { $ref: "#/components/responses/FactoryError" }
    delete:
      tags: [factory]
      operationId: deleteFactoryConnection
      description: |
        Connection owner only (403 factory_not_owner); no admin
        force-disconnect. Retires only the owner's bindings, then deletes the
        connection.
      responses:
        "204": { description: Disconnected }
        "403": { $ref: "#/components/responses/FactoryError" }
        "404": { $ref: "#/components/responses/FactoryError" }
  /api/v1/workspaces/{workspaceId}/factory/computers:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      tags: [factory]
      operationId: listFactoryComputers
      description: Connection owner only.
      responses:
        "200":
          description: Computers
          content:
            application/json:
              schema:
                type: object
                properties:
                  computers:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        name: { type: string }
                        status: { type: string }
        "403": { $ref: "#/components/responses/FactoryError" }
        "404": { $ref: "#/components/responses/FactoryError" }
        "502": { $ref: "#/components/responses/FactoryError" }
        "503": { $ref: "#/components/responses/FactoryError" }
  /api/v1/workspaces/{workspaceId}/factory/computers/{computerId}/sessions:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - { name: computerId, in: path, required: true, schema: { type: string, pattern: "^[A-Za-z0-9_-]{1,256}$" } }
    get:
      tags: [factory]
      operationId: listFactorySessions
      description: Connection owner only. An unreachable computer yields a warning, not an error.
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        title: { type: string }
                        computer_id: { type: string }
                        bound: { enum: [here, elsewhere, null] }
                  warning: { type: string }
        "403": { $ref: "#/components/responses/FactoryError" }
        "404": { $ref: "#/components/responses/FactoryError" }
        "422": { $ref: "#/components/responses/FactoryError" }
        "503": { $ref: "#/components/responses/FactoryError" }
  /api/v1/workspaces/{workspaceId}/factory/bindings:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      tags: [factory]
      operationId: listFactoryBindings
      description: The caller's own bindings in this workspace.
      responses:
        "200":
          description: Bindings
          content:
            application/json:
              schema:
                type: object
                properties:
                  bindings:
                    type: array
                    items: { $ref: "#/components/schemas/FactoryBinding" }
                  history: { const: deferred }
        "403": { $ref: "#/components/responses/FactoryError" }
        "404": { $ref: "#/components/responses/FactoryError" }
    post:
      tags: [factory]
      operationId: createFactoryBinding
      description: |
        Connection owner only. Binds a session pinned to its computer and
        registers one hosted Relay agent. 409 factory_cleanup_pending while a
        retired binding of the same session still holds its remote agent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id, computer_id]
              properties:
                session_id: { type: string }
                computer_id: { type: string }
      responses:
        "201":
          description: Bound
          content:
            application/json:
              schema:
                type: object
                properties:
                  binding_id: { type: string, format: uuid }
                  session_id: { type: string }
                  agent:
                    type: object
                    properties:
                      name: { type: string }
                      id: { type: string }
        "403": { $ref: "#/components/responses/FactoryError" }
        "404": { $ref: "#/components/responses/FactoryError" }
        "409": { $ref: "#/components/responses/FactoryError" }
        "422": { $ref: "#/components/responses/FactoryError" }
        "503": { $ref: "#/components/responses/FactoryError" }
  /api/v1/workspaces/{workspaceId}/factory/bindings/{bindingId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/FactoryBindingId"
    get:
      tags: [factory]
      operationId: getFactoryBinding
      description: Binding owner only; another member's binding is 404.
      responses:
        "200":
          description: Binding
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FactoryBinding" }
        "403": { $ref: "#/components/responses/FactoryError" }
        "404": { $ref: "#/components/responses/FactoryError" }
    delete:
      tags: [factory]
      operationId: deleteFactoryBinding
      description: |
        Binding owner only. Retires the binding, clears its secrets, payload
        ciphertext and reply hashes, and releases the Relay agent after commit.
        A missing binding is 204.
      responses:
        "204": { description: Unbound }
        "403": { $ref: "#/components/responses/FactoryError" }
        "404": { $ref: "#/components/responses/FactoryError" }
  /api/v1/workspaces/{workspaceId}/factory/bindings/{bindingId}/deliveries/{messageId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/FactoryBindingId"
      - { name: messageId, in: path, required: true, schema: { type: string } }
    get:
      tags: [factory]
      operationId: getFactoryDelivery
      description: Delivery receipt, binding owner only.
      responses:
        "200":
          description: Receipt
          content:
            application/json:
              schema:
                type: object
                properties:
                  state: { enum: [pending, sending, delivered, rejected, unknown] }
                  code: { type: string }
        "403": { $ref: "#/components/responses/FactoryError" }
        "404": { $ref: "#/components/responses/FactoryError" }
  /api/v1/workspaces/{workspaceId}/factory/bindings/{bindingId}/history/schedule:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/FactoryBindingId"
    post:
      tags: [factory]
      operationId: scheduleFactoryHistory
      description: Dormant. Records an intent only; 202 never means completed.
      responses:
        "202":
          description: Deferred
          content:
            application/json:
              schema:
                type: object
                properties:
                  queued: { const: 0 }
                  deferred: { const: true }
        "403": { $ref: "#/components/responses/FactoryError" }
        "404": { $ref: "#/components/responses/FactoryError" }
        "409": { $ref: "#/components/responses/FactoryError" }
  /api/v1/factory-sessions/agents/{bindingId}/messages:
    parameters:
      - $ref: "#/components/parameters/FactoryBindingId"
    post:
      tags: [factory]
      operationId: factoryReply
      security:
        - factoryReplyBearer: []
      description: |
        Droid reply. Bearer factory_reply_ plus 43 URL-safe characters, pinned
        to one binding, delivery and sender, valid 24h. Replies to the pinned
        sender only. A repeat with the same body returns the stored result; a
        different body is 409 reply_already_recorded.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [text]
              properties:
                text: { type: string, minLength: 1, maxLength: 20000 }
      responses:
        "200":
          description: Sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { const: true }
                  message_id: { type: string }
                  conversation_id: { type: string }
        "400": { $ref: "#/components/responses/FactoryError" }
        "401": { $ref: "#/components/responses/FactoryError" }
        "409": { $ref: "#/components/responses/FactoryError" }
        "413": { $ref: "#/components/responses/FactoryError" }
        "503": { $ref: "#/components/responses/FactoryError" }
  /api/v1/factory-sessions/relay-events/{bindingId}:
    parameters:
      - $ref: "#/components/parameters/FactoryBindingId"
    post:
      tags: [factory]
      operationId: factoryRelayEvents
      security: []
      description: Registered but always 404 while Relaycast subscriptions are deferred.
      responses:
        "404": { $ref: "#/components/responses/FactoryError" }
  /internal/v1/factory/job:
    post:
      tags: [internal, factory]
      operationId: factoryJob
      security:
        - factoryInternalToken: []
      description: |
        Manual Factory job kick. Raw path only (404 under /cloud), and 404 when
        SELFHOST_FACTORY_ENABLED is off or SELFHOST_INTERNAL_TOKEN is unset.
        inject claims a due pending row through the normal fence, moves an
        expired sending row to unknown (lease_expired), and never touches
        unknown, delivered or rejected rows. sweep expires leases and advances
        dormant history intents. history is deferred.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [v, kind]
                  properties:
                    v: { const: 1 }
                    kind: { const: sweep }
                    after: { type: string, format: uuid }
                - type: object
                  additionalProperties: false
                  required: [v, kind, bindingId]
                  properties:
                    v: { const: 1 }
                    kind: { const: history }
                    bindingId: { type: string, format: uuid }
                    scheduledAt: { type: string, format: date-time }
                - type: object
                  additionalProperties: false
                  required: [v, kind, bindingId, messageId]
                  properties:
                    v: { const: 1 }
                    kind: { const: inject }
                    bindingId: { type: string, format: uuid }
                    messageId: { type: string, pattern: "^[A-Za-z0-9_-]{1,128}$" }
      responses:
        "200":
          description: |
            {ok:true} plus expired/scheduled (sweep), deferred (history), or
            state, or skipped:true for an absent delivery (inject).
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { const: true }
                  skipped: { const: true }
                  state: { enum: [pending, sending, delivered, rejected, unknown] }
                  expired: { type: integer }
                  scheduled: { type: integer }
                  deferred: { const: true }
        "400": { $ref: "#/components/responses/FactoryError" }
        "401": { $ref: "#/components/responses/FactoryError" }
        "403": { $ref: "#/components/responses/FactoryError" }
        "404": { $ref: "#/components/responses/FactoryError" }
        "405": { $ref: "#/components/responses/FactoryError" }
        "503": { $ref: "#/components/responses/FactoryError" }
  /api/v1/workspaces/{workspaceId}/amp:
    get:
      operationId: getAmpWorkspace
      tags: [amp]
      summary: Amp connection and binding summary (key hint only; history reported as unavailable with reason push_session_unavailable until a push-only RelayHistory session can be issued). Owner/admin person with cli:auth. 404 {"error":"Not found"} before auth when SELFHOST_AMP_ENABLED is off. Also under /cloud. See docs/amp.md.
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: "{connection, bindings[{..., history: {state: unavailable|idle|queued|running|synced|error, reason?, lastSyncedAt, lastError, queuedAt}}], history: {available, reason?}}; never a secret"
        "401":
          description: unauthorized
        "403":
          description: forbidden (member, missing cli:auth, sh_wk_ workspace token or SELFHOST_INTERNAL_TOKEN)
        "404":
          description: Feature off ({"error":"Not found"}) or unknown workspace
  /api/v1/workspaces/{workspaceId}/amp/connection:
    post:
      operationId: connectAmp
      tags: [amp]
      summary: Connect an Amp API key (validated by a read-only discover, stored encrypted). Only the connected key's owner may replace it while threads are bound.
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key]
              properties:
                key: { type: string, pattern: "^sgamp_", description: Never returned or logged }
      responses:
        "200":
          description: Summary plus discovered threads
        "400":
          description: invalid_key or invalid_request
        "403":
          description: forbidden or not_connection_owner
        "409":
          description: connection_owner_locked or key_cannot_read_threads
        "502":
          description: amp_unavailable
        "503":
          description: amp_transport_not_configured
    delete:
      operationId: disconnectAmp
      tags: [amp]
      summary: Retire every binding, delete the stored key and release Relaycast identities after commit.
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: "{disconnected: true} with cleanup: pending when a Relaycast release must be retried"
  /api/v1/workspaces/{workspaceId}/amp/threads:
    get:
      operationId: discoverAmpThreads
      tags: [amp]
      summary: Up to 100 recent threads of the connected key. Connected key owner only.
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: "{threads: [{id, title}]}"
        "403":
          description: forbidden or not_connection_owner
        "409":
          description: amp_not_connected
  /api/v1/workspaces/{workspaceId}/amp/bindings:
    post:
      operationId: bindAmpThread
      tags: [amp]
      summary: Bind one explicitly chosen thread after the stored key exports it. Bind registers the Relaycast agent, mints a whsec_ secret (encrypted at rest, never returned) and creates two Relaycast subscriptions to the binding's relay-events URL (dm.received + thread.reply, and message.created filtered to mentions of the agent), signed with Standard Webhooks.
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [threadId]
              properties:
                threadId: { type: string, description: "T-<id> or https://ampcode.com/threads/T-<id>" }
      responses:
        "201":
          description: "{binding_id, thread_id, agent}"
        "400":
          description: invalid_thread
        "403":
          description: forbidden or not_connection_owner
        "409":
          description: amp_thread_unreadable, thread_owned or relay_name_taken
        "502":
          description: "relay_subscription_failed {error, message}: Relaycast refused or did not answer a subscription create. Subscriptions created by this attempt are deleted; the binding stays preparing and binding the thread again retries."
  /api/v1/workspaces/{workspaceId}/amp/bindings/{bindingId}:
    delete:
      operationId: unbindAmpThread
      tags: [amp]
      summary: Retire the binding (generation bump revokes reply capabilities and fences in-flight deliveries), then delete both Relaycast subscriptions (404 counts as deleted) and release the Relaycast identity.
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - { name: bindingId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: "{disconnected: true} with cleanup: pending when the release must be retried"
  /api/v1/workspaces/{workspaceId}/amp/bindings/{bindingId}/deliveries/{messageId}/check:
    post:
      operationId: checkAmpDelivery
      tags: [amp]
      summary: Read-only reconciliation (Cloud reconcileDelivery) of a delivery. Exports the bound thread and, only when the prompt's own marker is present, settles a pending, rejected or unknown row as delivered; a row under a live lease is left to the worker. Absence changes nothing and nothing is ever resent.
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - { name: bindingId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: messageId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: "{confirmed, state}: confirmed is whether the marker was found; state is the delivery state afterwards"
        "400":
          description: "{error: invalid_request, message}"
        "403":
          description: "{error: forbidden, message}: not a current owner or admin"
        "404":
          description: "{error: binding_not_found | delivery_not_found, message}; also when the binding was retired or rebound while the export ran"
        "409":
          description: "{error: relay_changed | amp_not_connected | amp_thread_unreadable, message}"
  /api/v1/amp/agents/{bindingId}/messages:
    post:
      operationId: sendAmpReply
      tags: [amp]
      summary: Reply from an Amp thread through its scoped capability. Prompt-embedded helper; not proof of native MCP use.
      security: [{ ampReplyBearer: [] }]
      parameters:
        - { name: bindingId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to, text, message_id, request_id]
              properties:
                to: { type: string }
                text: { type: string }
                message_id: { type: string }
                request_id: { type: string, format: uuid }
      responses:
        "200":
          description: "{ok, message_id} or {ok, duplicate, message_id} for an identical repeat"
        "401":
          description: Wrong binding, unknown, revoked or expired capability, or owner no longer a member
        "403":
          description: Recipient, message or request mismatch
        "409":
          description: reply_already_sent
        "413":
          description: payload_too_large (64 KiB)
        "502":
          description: reply_uncertain (retry with the same request_id; the Relaycast idempotency key prevents a double send)
  /api/v1/amp/relay-events/{bindingId}:
    post:
      operationId: receiveAmpRelayEvent
      tags: [amp]
      summary: Relaycast webhook for one binding, verified with Standard Webhooks v1 against the stored secret (300 s tolerance, 256 KiB body). Accepting only writes the outbox row.
      security: []
      parameters:
        - { name: bindingId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: webhook-id, in: header, required: true, schema: { type: string } }
        - { name: webhook-timestamp, in: header, required: true, schema: { type: string } }
        - { name: webhook-signature, in: header, required: true, schema: { type: string, description: "v1,<base64 HMAC-SHA256>; space-separated list during rotation" } }
      responses:
        "200":
          description: "{ok, queued} | {ok, duplicate} | {ok, delivered: false}"
        "400":
          description: invalid_request
        "401":
          description: Bad signature, stale timestamp or no stored secret
        "410":
          description: binding_gone
        "413":
          description: payload_too_large
  /api/v1/internal/amp/job:
    post:
      operationId: runAmpJob
      tags: [amp, internal]
      summary: Scheduler entry for the Amp outbox. Not served under /cloud. 404 {"error":"Not found"} when the feature is off or SELFHOST_AMP_INTERNAL_SECRET is unset.
      security: [{ ampInternalSecret: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - { type: object, required: [v, kind], properties: { v: { const: 1 }, kind: { const: sweep } } }
                - { type: object, required: [v, kind, bindingId, messageId], properties: { v: { const: 1 }, kind: { const: inject }, bindingId: { type: string }, messageId: { type: string } } }
                - { type: object, required: [v, kind, bindingId], properties: { v: { const: 1 }, kind: { const: history }, bindingId: { type: string }, scheduledAt: { type: string, format: date-time } } }
      responses:
        "200":
          description: "sweep {queued: 0, due, expired, deferred: true}; inject result or {ok, duplicate, state}; history {ok: true, queued: false, skipped: true} when not bound or already covered"
        "202":
          description: "history {ok: true, queued: true}: queued (coalesced) for src/amp/history.ts runHistory, which uploads to RelayHistory POST {baseUrl}/v1/ingest"
        "501":
          description: >-
            history_push_unavailable: history is implemented to the upload
            boundary (src/amp/history.ts) but inactive. It needs a
            workspace-scoped push-only (rth:sync) RelayHistory session issued
            without a caller token; src/relayhistory.ts
            issueRelayhistorySession only exchanges a caller's sh_at_ token and
            POST /internal/v1/auth/introspect answers only sh_at_ person tokens.
            See docs/amp.md.
        "400":
          description: invalid_request
        "401":
          description: Bearer required
        "403":
          description: Wrong credential
        "413":
          description: payload_too_large (64 KiB)
components:
  securitySchemes:
    factoryReplyBearer:
      type: http
      scheme: bearer
      description: Single-use Factory reply capability `factory_reply_` plus 43 URL-safe characters, shown to the Droid once inside the injected text; only its hash is stored.
    factoryInternalToken:
      type: http
      scheme: bearer
      description: SELFHOST_INTERNAL_TOKEN only. Workspace tokens and user sessions are 403 forbidden.
    bearerAuth:
      type: http
      scheme: bearer
      description: Device access token, or SELFHOST_BOOTSTRAP_TOKEN on documented management calls.
    cookieAuth:
      type: apiKey
      in: cookie
      name: agent_relay_session
      description: Secure HttpOnly same-origin cookie issued by /login/poll.
    deviceCookie:
      type: apiKey
      in: cookie
      name: agent_relay_device
      description: Short-lived Secure HttpOnly browser device-flow cookie.
    serviceAuth:
      type: http
      scheme: bearer
      description: SELFHOST_INTERNAL_TOKEN, a workspace API token (sh_wk_) with the runtime scope, or a flows worker credential accepted by the runtime credential verifier. Never a user session.
    ampReplyBearer:
      type: http
      scheme: bearer
      description: "`amp_reply_<43 base64url>` capability embedded in one Amp prompt; stored only as a SHA-256 hash, bound to one binding, message and request, revoked on unbind, disconnect or member removal, expires after 24 h."
    ampInternalSecret:
      type: http
      scheme: bearer
      description: SELFHOST_AMP_INTERNAL_SECRET. Not SELFHOST_INTERNAL_TOKEN, a workspace token or a user session.
    introspectAuth:
      type: http
      scheme: bearer
      description: RELAYCONTROL_INTROSPECT_SECRET, shared only with RelayHistory and relayfile pods. Not SELFHOST_INTERNAL_TOKEN, a workspace token or a user session.
    workerToken:
      type: http
      scheme: bearer
      description: Durable `sh_wrk_` token from /api/v1/workers/register, scoped to one worker.
    runToken:
      type: http
      scheme: bearer
      description: Run-bound `sh_run_` ingestion token from /api/v1/workflows/local-run.
    installToken:
      type: http
      scheme: bearer
      x-status: proposed
      description: |
        Desktop feed install token (proposed prefix `sh_dfi_`), minted by the
        downloads page from a browser session. Feed read for one profile
        through one workspace, lifetime 1 hour, revocable on the page and
        revoked with the user. Accepted by the four Desktop feed read
        endpoints only. Status: proposed, Cloud team decides, not yet confirmed.
    publisherToken:
      type: http
      scheme: bearer
      x-status: proposed
      description: |
        Desktop feed publisher token (proposed prefix `sh_dfp_`), the
        `DESKTOP_FEED_PUBLISHER_TOKEN` of one profile. Write-only on that
        profile's drafts plus the version listing; reads nothing else; never a
        workspace user's token; rotatable and revocable by the admin tool (not
        part of this contract). Status: proposed, Cloud team decides, not yet
        confirmed.
  parameters:
    FactoryBindingId:
      name: bindingId
      in: path
      required: true
      schema: { type: string, format: uuid }
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Provider:
      name: provider
      in: path
      required: true
      schema:
        type: string
        description: Provider id (github, slack, linear, notion, ...) or hosted config key.
    CliCredentialRef:
      name: X-Cli-Credential-Ref
      in: header
      required: true
      schema: { type: string }
      description: The run's short-lived reference from the assignment payload (`cliCredentials.ref`).
    AgentId:
      name: agentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WorkerId:
      name: workerId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FlowId:
      name: flowId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ObjectKey:
      name: objectKey
      in: path
      required: true
      description: Slash-separated key; no empty, `.`, or `..` segments.
      schema:
        type: string
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        maxLength: 512
    SessionSource:
      name: source
      in: query
      schema:
        type: string
        maxLength: 64
    SessionSince:
      name: since
      in: query
      description: ISO date or date-time, inclusive.
      schema:
        type: string
        maxLength: 64
    SessionUntil:
      name: until
      in: query
      description: ISO date or date-time, inclusive.
      schema:
        type: string
        maxLength: 64
    DesktopFeedProfile:
      name: X-Agent-Relay-Profile
      in: header
      required: true
      description: The build's compiled profile id. Required on every Desktop feed request; a request without it is 400 `profile_header_required`.
      schema: { type: string, pattern: "^[a-z0-9]{1,32}$" }
    DesktopFeedChannel:
      name: channel
      in: query
      required: true
      schema: { type: string, enum: [stable, beta] }
    DesktopFeedAssetId:
      name: assetId
      in: path
      required: true
      description: The manifest's `assets[].id`, looked up only within the header's profile.
      schema: { type: string, pattern: "^a_[0-9A-Za-z]{1,64}$" }
    DesktopFeedVersion:
      name: version
      in: path
      required: true
      schema: { type: string, pattern: "^[0-9]{4}\\.(?:[1-9]|1[0-2])\\.(?:0|[1-9][0-9]*)(?:-beta\\.(?:0|[1-9][0-9]*))?$" }
    DesktopFeedAssetName:
      name: name
      in: path
      required: true
      description: A declared `expected_assets[].name`; one path segment.
      schema: { type: string, maxLength: 255, pattern: "^[A-Za-z0-9][A-Za-z0-9_+-]*(?:\\.[A-Za-z0-9_+-]+)*$" }
  schemas:
    SessionReadCredentials:
      type: object
      additionalProperties: false
      required: [baseUrl, sessionId, userId, orgId, workspaceId, audience, scopes, accessToken, accessTokenExpiresAt, tokenType]
      properties:
        baseUrl: { type: string, format: uri }
        sessionId: { type: string }
        userId: { type: string }
        orgId: { type: string }
        workspaceId: { type: string }
        audience: { type: string, format: uri }
        scopes: { type: array, minItems: 1, maxItems: 1, items: { type: string, enum: ["rth:read"] } }
        accessToken: { type: string, pattern: '^rth_at_read_[A-Za-z0-9_-]{43,}$', maxLength: 4096 }
        accessTokenExpiresAt: { type: string, format: date-time }
        refreshToken: { type: string, pattern: '^rth_rt_read_[A-Za-z0-9_-]{43,}$', maxLength: 4096, description: Bearer clients only. }
        refreshTokenExpiresAt: { type: string, format: date-time, description: Bearer clients only. }
        tokenType: { type: string, enum: [Bearer] }
    FactorySummary:
      type: object
      properties:
        connected: { type: boolean }
        key_hint: { type: [string, "null"] }
        validated_at: { type: [string, "null"], format: date-time }
        user_is_owner: { type: boolean }
        bindings_count: { type: integer }
        history: { const: deferred }
    FactoryBinding:
      type: object
      properties:
        id: { type: string, format: uuid }
        session_id: { type: string }
        computer_id: { type: string }
        state: { enum: [preparing, bound, retired] }
        agent:
          type: object
          properties:
            name: { type: [string, "null"] }
            id: { type: [string, "null"] }
        history: { const: deferred }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        retired_at: { type: [string, "null"], format: date-time }
    FactoryError:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          description: Stable code, for example factory_not_owner, factory_other_member_bindings, factory_cleanup_pending, invalid_request.
        message: { type: string }

    ProviderStatus:
      type: object
      additionalProperties: false
      required: [id, product, family, transport, setup, history, outbound, mcpGroups,
        implemented, configured, enabled, mcpGroupsRegistered]
      properties:
        id: { type: string, enum: [amp, factory, copilot, capy, replicas, dot, grok-bot] }
        product: { type: string }
        family: { type: string, enum: [remote_coding_agent, assistant_connector, local_app] }
        transport: { type: string }
        setup: { type: string, enum: [api_key, oauth_grant, desktop_roundtrip] }
        history:
          type: object
          additionalProperties: false
          required: [kind, source, coverage]
          properties:
            kind: { type: string, enum: [native_transcript_pull, redacted_mcp_activity, desktop_owned, none] }
            source: { type: [string, "null"] }
            coverage: { type: string, enum: [event_triggered, continuous, passive_tail, n_a] }
            notes: { type: string }
        outbound: { type: string, enum: ["relay:mcp", "relay:events", none] }
        mcpGroups:
          type: array
          description: MCP tool group ids (as reported by describe_capabilities `groups`) this provider owns.
          items: { type: string }
        implemented: { type: boolean, description: A provider module is present in this build. }
        configured: { type: boolean, description: The provider's configuration resolves. }
        enabled: { type: boolean, description: The provider module is mounted and switched on. }
        mcpGroupsRegistered: { type: boolean, description: The provider owns MCP groups and every one is served. }
    CaptureSettings:
      type: object
      additionalProperties: false
      description: Only present keys are enforced; an absent key means the member chooses.
      properties:
        sharing_mode: { type: string, enum: [all, new, selected] }
        upload_control: { type: string, enum: [operator, user] }
        oops_window_seconds: { type: integer, minimum: 0, maximum: 86400 }
        user_retroactive_delete: { type: boolean }
    SessionErasure:
      type: object
      additionalProperties: false
      required: [orgId, sessionId, requestId, status, requestedAt, completedAt, artifacts, uploadsFenced, failure, audit]
      properties:
        orgId: { type: string }
        sessionId: { type: string }
        requestId: { type: string }
        status: { type: string, enum: [in_progress, completed, failed] }
        requestedAt: { type: string, format: date-time }
        completedAt: { type: [string, "null"], format: date-time }
        artifacts:
          type: object
          description: Erased item count per artifact category; never content.
          additionalProperties: { type: integer, minimum: 0 }
        uploadsFenced: { type: boolean }
        failure:
          type: [object, "null"]
          additionalProperties: false
          required: [code]
          properties:
            code: { type: string }
        audit:
          type: [object, "null"]
          additionalProperties: false
          required: [action, actorKind, actorId, recordedAt]
          properties:
            action: { type: string, enum: [session.hard_deleted] }
            actorKind: { type: string }
            actorId: { type: [string, "null"] }
            recordedAt: { type: string, format: date-time }
    CapturePolicy:
      type: object
      additionalProperties: false
      required: [version, revision, settings]
      properties:
        version: { type: integer, enum: [1] }
        revision: { type: integer, minimum: 1, description: Monotonic per organization; 1 when never set }
        settings: { $ref: "#/components/schemas/CaptureSettings" }
    TelemetryIssueInput:
      type: object
      additionalProperties: false
      required: [title, summary]
      properties:
        title: { type: string, maxLength: 200 }
        summary: { type: string, maxLength: 4000 }
        severity: { type: string, enum: [low, medium, high, critical], default: medium }
        category: { type: string, enum: [bug, outage, performance, upgrade, configuration, question], default: bug }
        component: { type: string, pattern: "^[a-z][a-z0-9-]{0,39}$" }
        stepsToReproduce: { type: string, maxLength: 4000 }
        expected: { type: string, maxLength: 2000 }
        observed: { type: string, maxLength: 2000 }
        supportBundle:
          type: object
          description: Output of helm-charts scripts/support/collect-support-bundle.py ({manifest, documents} or a map of its JSON documents). Only known documents are kept, each at most 64 KiB.
        dryRun: { type: boolean, default: false }
    Status:
      type: object
      required: [status]
      properties:
        status:
          type: string
    Readiness:
      type: object
      required: [status, introspection]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        introspection:
          type: object
          required: [enabled, audiences]
          properties:
            enabled:
              type: boolean
              description: True when RELAYCONTROL_INTROSPECT_SECRET is set. The secret is never shown.
            audiences:
              type: array
              description: Normalized origins POST /internal/v1/auth/introspect accepts as `aud`; empty while disabled.
              items: { type: string }
    DeviceStart:
      type: object
      required:
        - device_code
        - user_code
        - verification_uri
        - verification_uri_complete
        - expires_in
        - interval
      properties:
        device_code:
          type: string
        user_code:
          type: string
        verification_uri:
          type: string
          format: uri
        verification_uri_complete:
          type: string
          format: uri
        expires_in:
          type: integer
        interval:
          type: integer
    DeviceTokenRequest:
      type: object
      required: [device_code]
      properties:
        grant_type:
          const: urn:ietf:params:oauth:grant-type:device_code
        device_code:
          type: string
    OAuthTokenPair:
      type: object
      required:
        - access_token
        - refresh_token
        - token_type
        - access_token_expires_at
        - refresh_token_expires_at
        - scope
        - api_url
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          const: Bearer
        access_token_expires_at:
          type: string
          format: date-time
        refresh_token_expires_at:
          type: string
          format: date-time
        scope:
          type: string
        api_url:
          type: string
          format: uri
          description: "`<site>/cloud`, as hosted Cloud returns; Desktop requires it. <site> is SELFHOST_DASHBOARD_URL's origin when the request arrived on the dashboard host, otherwise SELFHOST_PUBLIC_URL."
    DeviceLookup:
      type: object
      required: [user_code, client_name, desktop_host_name, status, expires_at, current_workspace_id, workspaces]
      properties:
        user_code:
          type: string
        client_name:
          type: [string, "null"]
        desktop_host_name:
          type: [string, "null"]
        status:
          enum: [pending, approved, denied, expired, consumed]
        expires_at:
          type: string
          format: date-time
        current_workspace_id:
          type: [string, "null"]
        workspaces:
          type: array
          items:
            type: object
            required: [id, name, organization_name]
            properties:
              id:
                type: string
              name:
                type: string
              organization_name:
                type: [string, "null"]
    TokenPair:
      type: object
      required:
        - accessToken
        - refreshToken
        - accessTokenExpiresAt
        - refreshTokenExpiresAt
        - tokenType
        - apiUrl
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        accessTokenExpiresAt:
          type: string
          format: date-time
        refreshTokenExpiresAt:
          type: string
          format: date-time
        tokenType:
          const: Bearer
        apiUrl:
          type: string
          format: uri
          description: "`<site>/cloud` (the dashboard or public origin the request arrived on)"
    Whoami:
      type: object
      required:
        - authenticated
        - source
        - subjectType
        - scopes
        - user
        - currentOrganization
        - currentWorkspace
      properties:
        authenticated:
          const: true
        source:
          const: token
        subjectType:
          const: cli
        scopes:
          type: array
          items:
            type: string
        user:
          type: object
        currentOrganization:
          type: object
        currentWorkspace:
          type: object
    WorkspaceResolution:
      type: object
      required:
        - workspaceId
        - cloudWorkspaceId
        - relaycastWorkspaceId
        - organizationId
        - name
        - relaycastApiKey
        - urls
        - provisioned
      properties:
        workspaceId:
          type: string
          format: uuid
        cloudWorkspaceId:
          type: string
          format: uuid
        relaycastWorkspaceId:
          type: string
        organizationId:
          type: string
          format: uuid
        name:
          type: string
        relaycastApiKey:
          type: string
        urls:
          type: object
          required: [relaycastUrl]
          properties:
            relaycastUrl:
              type: string
              format: uri
        provisioned:
          const: false
    DashboardAccount:
      type: object
      required: [authenticated, user, currentWorkspace]
      properties:
        authenticated:
          const: true
        user:
          type: object
          required: [id, name]
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
        currentWorkspace:
          type: object
          required: [id, name]
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
    DashboardSessionPage:
      type: object
      required: [items, nextCursor, error]
      properties:
        items:
          type: array
          items:
            type: object
            required: [sessionId, source]
            properties:
              sessionId:
                type: string
              source:
                type: string
              summary:
                type: [string, "null"]
              lastTs:
                type: [string, "null"]
              project:
                anyOf:
                  - type: object
                    required: [name]
                    properties:
                      name:
                        type: string
                  - type: "null"
        members:
          $ref: "#/components/schemas/DashboardSessionMembers"
        nextCursor:
          type: [string, "null"]
        error:
          const: false
        now:
          type: string
          format: date-time
        ranking:
          const: hybrid
    DashboardEventPage:
      type: object
      required: [events, error]
      properties:
        events:
          type: array
          items:
            type: object
            required: [eventId, ts]
            properties:
              eventId:
                type: string
                minLength: 1
              ts:
                type: string
                format: date-time
              source:
                type: [string, "null"]
              content:
                type: [string, "null"]
              contentTruncated:
                type: boolean
        members:
          $ref: "#/components/schemas/DashboardSessionMembers"
        error:
          const: false
        nextCursor:
          type: [string, "null"]
    DashboardSessionMembers:
      description: Organization members, for session attribution (no emails).
      type: array
      items:
        type: object
        required: [id, name]
        properties:
          id:
            type: string
          name:
            type: [string, "null"]
    DashboardSessionActivity:
      type: object
      required: [days]
      properties:
        days:
          type: array
          items:
            type: object
            required: [date, conversations, bySource]
            properties:
              date:
                type: string
                format: date
              conversations:
                type: integer
                minimum: 0
              bySource:
                type: object
                additionalProperties:
                  type: integer
                  minimum: 1
    UnsupportedByBackend:
      description: |
