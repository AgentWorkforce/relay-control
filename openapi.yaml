            application/json:
              schema: { $ref: "#/components/schemas/RuntimeIntegrationToken" }
        "404": { description: connection_not_found }
        "409": { description: "token_expired, connection_error, or refresh_failed: reconnect required" }
        "422": { description: connection_undecryptable }
        "503": { description: Provider token endpoint unreachable }
